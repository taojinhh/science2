 rel:['유전자증폭검사','감염병','감염병 추적과 방역']},

{unit:'III-1', name:'유전자증폭검사', alias:['PCR','핵산 진단','유전자 증폭'],
 one:'검체 속 바이러스의 특정 유전자(핵산)를 증폭한 뒤 감염 여부를 정밀하게 확인하는 검사법.',
 body:['<b>유전자증폭검사</b>는 채취한 검체에 들어 있는 <b>바이러스의 특정 유전자를 증폭</b>한 다음, 검체에 바이러스가 존재하는지를 확인하는 검사법입니다.',
  '즉 검체에 들어 있는 <b>매우 적은 양의 핵산</b>을 <b>단시간에 많은 양으로 복제</b>한 다음, 병원체 감염 여부를 보다 <b>정밀하게</b> 분석하는 방법이에요.',
  '증폭은 한 번 할 때마다 양이 2배가 되므로, 여러 번 반복하면 아주 적은 양도 확인할 수 있을 만큼 늘어납니다.',
  '정밀도가 높기 때문에 감염 여부의 <b>최종 진단</b>에 사용됩니다.',
  '최근에는 <b>나노바이오센서</b>를 이용한 진단 기술도 개발되고 있습니다. 바이오센서와 나노 기술이 결합한 것으로, 아주 적은 양의 병원체도 찾아낼 수 있어요.'],
 analogy:'유전자증폭검사는 <b>작은 글씨를 복사기로 계속 확대해 읽는 것</b>과 같습니다. 처음엔 안 보여도 크게 키우면 확실히 보이죠.',
 sim:'diagnosis',
 examples:['코로나바이러스감염증 PCR 검사','나노바이오센서를 이용한 초정밀 진단'],
 caution:'신속항원검사는 <b>단백질</b>, 유전자증폭검사는 <b>핵산</b>을 이용합니다. 무엇을 이용하는지 묻는 문제가 자주 나오니 꼭 구분하세요.',
 quiz:[{q:'유전자증폭검사의 특징으로 옳은 것은?',
   c:['적은 양의 핵산을 증폭해 정밀하게 진단한다','단백질을 이용해 간단히 진단한다','증상만으로 판단한다','환자의 동선을 추적한다'],a:0,
   why:'유전자증폭검사는 검체 속 핵산을 단시간에 많은 양으로 복제한 뒤 정밀하게 분석합니다.'}],
 rel:['신속항원검사','감염병','빅데이터']},

{unit:'III-1', name:'감염병 추적과 방역', alias:['방역','감염병 추적','GPS','감염원'],
 one:'감염원과 환자의 규모를 파악하고 이동 경로를 추적해, 감염병이 퍼지지 않게 막는 일.',
 body:['감염병을 효과적으로 관리하려면 진단뿐 아니라, <b>감염원 및 감염병 환자의 규모를 파악</b>하고 환자의 <b>감염 경로와 동선을 추적·관리</b>하는 것이 필요합니다.',
  '최근에는 조사관이 동선을 일일이 파악하는 대신, 스마트 기기에 내장된 <b>위성 위치 확인 시스템(GPS), 와이파이, 블루투스, 센서</b> 등을 활용해 정보를 수집하고 공유하는 방식으로 추적이 이루어집니다.',
  '또한 감염병의 특성을 파악하고 확산을 예측하기 위해 <b>빅데이터 기술과 인공지능 기술</b>이 활용됩니다.',
  '<b>방역</b>은 감염병이 발생하거나 유행하는 것을 미리 막는 일입니다. 환자와의 접촉을 줄이고 의료 체계의 부담을 덜기 위해 <b>방역 로봇</b> 같은 인공지능 로봇도 개발되고 있어요.',
  '이처럼 과학은 <b>진단 → 추적 → 방역 → 치료</b>에 이르는 감염병 관리의 <b>전 과정</b>에서 유용하게 이용되고 있습니다.'],
 analogy:'감염병 추적은 <b>불이 어디서 시작해 어디로 번지는지 지도를 그리는 일</b>입니다. 지도가 정확할수록 불을 빨리 끌 수 있어요.',
 sim:'trace',
 examples:['GPS·블루투스를 이용한 접촉자 알림','빅데이터로 확산 경로 예측','방역·소독이 가능한 방역 로봇'],
 caution:'동선 추적은 감염병 관리에 도움이 되지만, <b>사생활 침해</b> 문제가 생길 수 있습니다. 과학 기술 활용에는 언제나 윤리적 고려가 함께 필요해요.',
 quiz:[{q:'감염병 추적에 활용되는 기술로 보기 어려운 것은?',
   c:['중화 반응','위성 위치 확인 시스템(GPS)','빅데이터 기술','인공지능 기술'],a:0,
   why:'GPS·와이파이·블루투스·센서, 빅데이터와 인공지능 기술이 감염병 추적에 활용됩니다.'}],
 rel:['감염병','빅데이터','인공지능 로봇','과학 윤리']},

{unit:'III-1', name:'빅데이터', alias:['big data','유전체'],
 one:'기존의 데이터 관리·처리 도구로는 다루기 어려운 방대한 양의 데이터.',
 body:['현대 사회에서는 다양하고 많은 양의 데이터가 디지털 형태로 전환되어 실시간으로 빠르게 수집되면서 <b>빅데이터</b>가 형성되고 있습니다.',
  '<b>빅데이터</b>는 기존의 데이터 관리 및 처리 도구로는 다루기 어려운 <b>방대한 양의 데이터</b>입니다.',
  '<b>활용 분야</b>',
  '· <b>기상 관측</b> — 기상 위성·관측소의 데이터를 분석해 기상 현상의 패턴을 찾아 <b>예측 정확도</b>를 높입니다.',
  '· <b>유전체 분석</b> — 개인에게 발생 가능한 질병을 예측하고, 유전적 특성에 맞는 치료를 받게 합니다. (유전체 : 한 개체의 모든 유전정보)',
  '· <b>신약 개발</b> — 신약 후보 물질과 합성 방법을 찾습니다.',
  '· <b>과학 실험</b> — 개별 연구자만으로는 수행하기 어려웠던 실험을 할 수 있게 합니다.',
  '<b>문제점</b> : 사생활 침해 가능성, 충분히 검증되지 못한 데이터의 활용 가능성, 지나친 데이터 의존 등도 제기되고 있습니다.'],
 analogy:'빅데이터는 <b>어마어마하게 큰 도서관</b>입니다. 책이 많을수록 답을 찾을 확률은 높아지지만, 정리하고 찾는 기술이 없으면 아무 소용이 없어요.',
 sim:'bigdata',
 examples:['기상청 날씨마루의 농산물 생산성 예측 서비스','맛집 앱의 평점·리뷰 데이터','감염병 확산 예측'],
 caution:'빅데이터는 <b>장점만 있는 것이 아닙니다</b>. 사생활 침해, 검증되지 않은 데이터, 지나친 데이터 의존 같은 문제점도 함께 인식해야 합니다.',
 quiz:[{q:'빅데이터를 활용할 때 생길 수 있는 문제점으로 알맞은 것은?',
   c:['사생활 침해 가능성','기상 예측의 정확도가 낮아짐','신약 개발이 불가능해짐','과학 실험을 할 수 없게 됨'],a:0,
   why:'빅데이터를 형성하는 과정에서 사생활 침해, 검증되지 못한 데이터의 활용, 지나친 데이터 의존 등의 문제가 제기되고 있습니다.'}],
 rel:['사물 인터넷','인공지능 로봇','감염병 추적과 방역','과학 윤리']},

{unit:'III-2', name:'사물 인터넷', alias:['IoT','스마트팜','스마트홈','스마트 도시','스마트 물류'],
 one:'센서·통신 기능·소프트웨어를 내장한 사물이 인터넷에 연결된 다른 사물·주변 환경과 데이터를 주고받는 기술.',
 body:['석유·석탄 등 자원에 기반했던 산업 시대와 달리, <b>지능정보화 시대</b>는 <b>데이터</b>에 기반하여 과학 기술이 발전하고 있습니다.',
  '<b>사물 인터넷(IoT)</b>은 센서, 통신 기능, 소프트웨어를 내장한 사물이 인터넷에 연결된 다른 사물과 주변 환경의 데이터를 주고받는 기술입니다. <b>실시간으로 데이터를 수집</b>하지요.',
  '사용자는 원격으로 사물의 상태를 <b>파악하고 제어</b>할 수 있습니다.',

  '즉 <b>데이터화 → 정보화 → 지능화</b>의 흐름에서 사물 인터넷은 가장 앞의 <b>기초 기술</b>입니다.'],
 analogy:'사물 인터넷은 사물마다 달아 준 <b>눈과 입</b>입니다. 사물이 주변을 보고(센서) 서로 이야기(통신)할 수 있게 되는 거예요.',
 sim:'iot',
 examples:['스마트팜 : 온도·습도·토양 상태·작물의 성장을 실시간 파악해 물 공급',

   why:'스마트팜은 온도·습도·토양 상태·작물의 성장을 실시간으로 파악합니다.'}],

{unit:'III-2', name:'인공지능 로봇', alias:['인공지능','AI','로봇','기계학습','라이더'],

/* =========================================================
   [4] 앱 (검색 · 화면 그리기)
   ========================================================= */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(str){
  let r='';
  for(const ch of str){
    const c = ch.charCodeAt(0)-0xAC00;
    if(c>=0 && c<=11171) r += CHO[Math.floor(c/588)];
    else r += ch;
  }
  return r;
}
function norm(s){ return (s||'').replace(/[\s·,()·\-]/g,'').toLowerCase(); }

TERMS.forEach(t=>{
  t._n = norm(t.name);
  t._c = chosung(t._n);
  t._a = (t.alias||[]).map(norm);
  t._ac= t._a.map(chosung);
  t._body = norm((t.body||[]).join('')+(t.one||'')+(t.analogy||'')+(t.caution||'')+(t.examples||[]).join('')+(t.formula||[]).join(''));
});
const BYID = {}; TERMS.forEach(t=> BYID[t.name]=t);

function search(qraw){
  const q = norm(qraw); if(!q) return [];
  const qc = chosung(q);
  const hit = [];
  TERMS.forEach(t=>{
    let sc = 0;
    if(t._n === q) sc = 100;
    else if(t._a.includes(q)) sc = 95;
    else if(t._n.startsWith(q)) sc = 80;
    else if(t._n.includes(q)) sc = 70;
    else if(t._a.some(a=>a.includes(q))) sc = 60;
    else if(t._c === qc) sc = 55;
    else if(t._c.includes(qc) && qc.length>=2) sc = 45;
    else if(t._ac.some(a=>a.includes(qc)) && qc.length>=2) sc = 40;
    else if(t._body.includes(q) && q.length>=2) sc = 20;
    if(sc) hit.push([sc,t]);
  });
  hit.sort((a,b)=> b[0]-a[0] || a[1].name.length-b[1].name.length);
  return hit.map(h=>h[1]);
}

/* --- 진도 저장 --- */
const KEY = 'sci2_dict_done';
function getDone(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } }
function setDone(a){ try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){} }
function toggleDone(name){
  const d = getDone(); const i = d.indexOf(name);
  if(i<0) d.push(name); else d.splice(i,1);
  setDone(d); paintProgress(); buildTOC(cur);
  return d.includes(name);
}
function paintProgress(){
  const d = getDone().filter(n=>BYID[n]).length;
  document.getElementById('bar').style.width = (d/TERMS.length*100)+'%';
  document.getElementById('progtxt').textContent = d+' / '+TERMS.length+' 개 이해 완료';
}

/* --- 사이드 목차 --- */
let cur = null;
function buildTOC(active){
  const done = getDone();
  const box = document.getElementById('toc'); box.innerHTML='';
  Object.keys(UNITS).forEach(u=>{
    const list = TERMS.filter(t=>t.unit===u); if(!list.length) return;
    const d = document.createElement('div'); d.className='unit';
    if(active && BYID[active] && BYID[active].unit===u) d.classList.add('open');
    const b = document.createElement('button');
    b.innerHTML = UNITS[u]+' <span style="float:right;color:#8fa39a;font-weight:400">'+list.length+'</span>';
    b.onclick = ()=> d.classList.toggle('open');
    const ul = document.createElement('ul');
    list.forEach(t=>{
      const li = document.createElement('li'); li.textContent = t.name;
      if(done.includes(t.name)) li.classList.add('done');
      if(t.name===active) li.classList.add('cur');
      li.onclick = ()=> show(t.name);
      ul.appendChild(li);
    });
    d.appendChild(b); d.appendChild(ul); box.appendChild(d);
  });
}

function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }

function show(name){
  const t = BYID[name]; if(!t) return;
  cur = name;
  stopSims();
  const m = document.getElementById('main'); m.innerHTML='';
  const c = el('div','card');

  c.appendChild(el('div','badge', UNITS[t.unit]));
  c.appendChild(el('h1','term', t.name));
  if(t.alias && t.alias.length) c.appendChild(el('div','alias','비슷한 말 · 함께 쓰는 말 : '+t.alias.join(' · ')));
  c.appendChild(el('div','oneline','📌 '+t.one));

  if(t.body && t.body.length){
    c.appendChild(el('h2','sec','🧭 자세히 알아보기'));
    const b = el('div','body'); t.body.forEach(p=> b.appendChild(el('p','',p))); c.appendChild(b);
  }
  if(t.analogy) c.appendChild(el('div','analogy','<b>🍀 이렇게 생각하면 쉬워요</b><br>'+t.analogy));
  if(t.formula && t.formula.length){
    c.appendChild(el('h2','sec','✏️ 반응식 · 공식'));
    t.formula.forEach(f=> c.appendChild(el('div','formula', f)));
  }
  if(t.sim){
    c.appendChild(el('h2','sec','🎛️ 직접 움직여 보기'));
    (Array.isArray(t.sim)?t.sim:[t.sim]).forEach(id=> mountSim(c,id));
  }
  if(t.examples && t.examples.length){
    c.appendChild(el('h2','sec','🌍 생활 속에서 찾아보기'));
    const ul = el('ul','ex'); t.examples.forEach(e=> ul.appendChild(el('li','',e))); c.appendChild(ul);
  }
  if(t.caution) c.appendChild(el('div','caution','<b>⚠️ 많이 헷갈리는 점</b><br>'+t.caution));

  if(t.quiz && t.quiz.length){
    c.appendChild(el('h2','sec','✅ 확인 문제'));
    t.quiz.forEach(qz=>{
      const q = el('div','quiz');
      q.appendChild(el('div','q', qz.q));
      const why = el('div','why','정답 풀이 : '+qz.why);
      qz.c.forEach((o,i)=>{
        const op = el('div','opt', (i+1)+'. '+o);
        op.onclick = ()=>{
          if(q.dataset.ans) return;
          q.dataset.ans = '1';
          [...q.querySelectorAll('.opt')].forEach((e,j)=>{
            if(j===qz.a) e.classList.add('right');
            else if(j===i) e.classList.add('wrong');
          });
          why.style.display='block';
        };
        q.appendChild(op);
      });
      q.appendChild(why); c.appendChild(q);
    });
  }
  if(t.rel && t.rel.length){
    c.appendChild(el('h2','sec','🔗 함께 보면 좋은 용어'));
    const r = el('div','rel');
    t.rel.forEach(n=>{ if(!BYID[n]) return; const s=el('span','',n); s.onclick=()=>show(n); r.appendChild(s); });
    c.appendChild(r);
  }

  const fb = el('div','footbar');
  const isDone = getDone().includes(t.name);
  const bd = el('button', isDone?'done':'', isDone?'✓ 이해 완료':'이해했어요 체크');
  bd.onclick = ()=>{ const on = toggleDone(t.name); bd.className = on?'done':''; bd.textContent = on?'✓ 이해 완료':'이해했어요 체크'; };
  const br = el('button','','🎲 다른 용어 랜덤');
  br.onclick = ()=> show(TERMS[Math.floor(Math.random()*TERMS.length)].name);
  const bh = el('button','','🏠 처음 화면');
  bh.onclick = ()=> home();
  const bp = el('button','','🖨 인쇄');
  bp.onclick = ()=> window.print();
  fb.appendChild(bd); fb.appendChild(br); fb.appendChild(bh); fb.appendChild(bp);
  c.appendChild(fb);

  m.appendChild(c); buildTOC(name);
  window.scrollTo({top:0,behavior:'smooth'});
  document.getElementById('q').value = '';
  document.getElementById('suggest').style.display='none';
}

function results(list, qs){
  stopSims(); cur=null;
  const m = document.getElementById('main'); m.innerHTML='';
  const c = el('div','card');
  c.appendChild(el('div','badge gray','검색 결과'));
  c.appendChild(el('h1','term','"'+qs+'" 검색 결과 '+list.length+'개'));
  if(!list.length){
    c.appendChild(el('div','empty','<b>찾는 용어가 없어요 😅</b>다르게 입력해 보거나, 왼쪽 <b style="display:inline">교과서 차례</b>에서 골라 보세요.<br>예) 화석 · 자연선택 · 중화 반응 · 생태계평형 · 전자기 유도 · 빅데이터'));
  }
  list.forEach(t=>{
    const r = el('div','rescard','<b>'+t.name+'</b> <span style="color:#8fa39a;font-size:13px">'+UNITS[t.unit]+'</span><p>'+t.one+'</p>');
    r.onclick = ()=> show(t.name); c.appendChild(r);
  });
  m.appendChild(c); buildTOC(null); window.scrollTo({top:0,behavior:'smooth'});
}

function home(){
  stopSims(); cur=null;
  const m = document.getElementById('main'); m.innerHTML='';
  const c = el('div','card');
  c.appendChild(el('div','badge','통합과학2 기초 개념 · 전체 '+TERMS.length+'개 용어'));
  c.appendChild(el('h1','term','무엇이 궁금한가요?'));
  c.appendChild(el('div','oneline','위 검색창에 <b>모르는 낱말</b>을 그대로 입력해 보세요. 초성(예: <b>ㅈㅇㅅㅌ</b> → 자연선택)이나 뜻풀이 속 단어로도 찾을 수 있어요. 아래 목록에서 눌러도 됩니다.'));
  const g = el('div','home-grid');
  Object.keys(UNITS).forEach(u=>{
    const list = TERMS.filter(t=>t.unit===u); if(!list.length) return;
    const d = el('div','home-unit','<h4>'+UNITS[u]+'</h4>');
    list.forEach(t=>{ const s=el('span','',t.name); s.onclick=()=>show(t.name); d.appendChild(s); });
    g.appendChild(d);
  });
  c.appendChild(g);
  c.appendChild(el('div','simnote','💡 <b>사용법</b> : 용어 화면에는 <b>한 줄 정의 → 자세한 설명 → 쉬운 비유 → 반응식 → 직접 움직여 보는 자료 → 생활 예시 → 헷갈리는 점 → 확인 문제 → 관련 용어</b> 순서로 나옵니다. 이해한 용어는 <b>[이해했어요 체크]</b>를 누르면 왼쪽 목차에 ✓ 가 표시되고 진도가 저장됩니다.'));
  m.appendChild(c); buildTOC(null);
}

/* --- 검색창 동작 --- */
const qEl = document.getElementById('q'), sgEl = document.getElementById('suggest');
let sgIdx = -1, sgList = [];
function drawSuggest(){
  const list = search(qEl.value).slice(0,8); sgList=list; sgIdx=-1;
  if(!qEl.value.trim() || !list.length){ sgEl.style.display='none'; return; }
  sgEl.innerHTML='';
  list.forEach(t=>{
    const d = el('div','', t.name+'<span class="sg-unit">'+UNITS[t.unit]+'</span>');
    d.onclick = ()=> show(t.name);
    sgEl.appendChild(d);
  });
  sgEl.style.display='block';
}
qEl.addEventListener('input', drawSuggest);
qEl.addEventListener('keydown', e=>{
  const items = [...sgEl.querySelectorAll('div')];
  if(e.key==='ArrowDown'){ sgIdx=Math.min(sgIdx+1,items.length-1); }
  else if(e.key==='ArrowUp'){ sgIdx=Math.max(sgIdx-1,0); }
  else if(e.key==='Enter'){
    if(sgIdx>=0 && sgList[sgIdx]) show(sgList[sgIdx].name);
    else doSearch();
    return;
  } else if(e.key==='Escape'){ sgEl.style.display='none'; return; }
  else return;
  items.forEach((d,i)=> d.classList.toggle('on', i===sgIdx));
  e.preventDefault();
});
function doSearch(){
  const v = qEl.value.trim(); if(!v) return;
  const list = search(v);
  if(list.length===1 || (list[0] && norm(list[0].name)===norm(v))) show(list[0].name);
  else results(list, v);
}
document.getElementById('btnSearch').onclick = doSearch;
document.addEventListener('click', e=>{ if(!e.target.closest('.searchbar')) sgEl.style.display='none'; });

/* --- 자주 찾는 용어 칩 --- */
const HOT = ['화석','자연선택','생물다양성','산화','중화 반응','생태계평형','지구 온난화','전자기 유도','에너지 효율','빅데이터'];
const chipBox = document.getElementById('chips');
HOT.forEach(n=>{
  if(!BYID[n]) return;
  const s = el('span','chip', n); s.onclick = ()=> show(n); chipBox.appendChild(s);
});

paintProgress();
home();
</script>
