<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통합과학2 기초 개념 사전 — 용어를 입력하면 원리가 보인다</title>
<style>
  :root{
    --bg:#f3f7f5; --card:#ffffff; --ink:#1c2b26; --sub:#5a6b64; --line:#e0eae5;
    --brand:#2f8f6b; --brand-soft:#e3f4ec; --accent:#e8590c; --ok:#2f9e44;
    --shadow:0 2px 10px rgba(20,50,40,.07), 0 12px 30px rgba(20,50,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.78; font-size:16px;
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  }
  /* 검색창 입력은 정상적으로 쓸 수 있어야 하므로 예외 */
  input,textarea,select{ -webkit-user-select:text; -moz-user-select:text; -ms-user-select:text; user-select:text; }
  a{color:var(--brand)}
  header{
    background:linear-gradient(120deg,#e2f3ea 0%,#e6f0fb 36%,#f3ecfa 68%,#fdf2e6 100%);
    color:#31463e; padding:22px 18px 24px; border-bottom:1px solid #e2ebe6;
  }
  .hwrap{max-width:1180px;margin:0 auto}
  .htitle{font-size:23px;font-weight:800;letter-spacing:-.6px;margin:0 0 3px;color:#2b5145}
  .hsub{font-size:13.5px;margin:0 0 14px;color:#5b7168}
  .searchbar{position:relative;display:flex;gap:8px;align-items:center}
  .searchbar input{
    flex:1; padding:14px 16px; font-size:17px; border:1px solid #d8e5de; border-radius:12px;
    box-shadow:0 4px 14px rgba(60,120,100,.10); outline:none; font-family:inherit;
    background:#fff; color:var(--ink);
  }
  .searchbar input:focus{border-color:#8ecfb4;box-shadow:0 4px 16px rgba(60,140,110,.18)}
  .searchbar input::placeholder{color:#a3b3ac}
  .searchbar button{
    padding:14px 18px;font-size:16px;font-weight:700;border:0;border-radius:12px;
    background:#39a077;color:#fff;cursor:pointer;font-family:inherit;white-space:nowrap;
    box-shadow:0 4px 12px rgba(60,150,115,.30);
  }
  .searchbar button:hover{background:#2f8f6b}
  #suggest{
    position:absolute;top:56px;left:0;right:0;background:#fff;color:var(--ink);
    border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:60;display:none;
    max-height:340px;overflow-y:auto;
  }
  #suggest div{padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--line);font-size:15px}
  #suggest div:last-child{border-bottom:0}
  #suggest div:hover,#suggest div.on{background:var(--brand-soft)}
  #suggest .sg-unit{color:var(--sub);font-size:12.5px;margin-left:8px}
  .chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px}
  .chips b{font-size:12.5px;align-self:center;margin-right:2px;font-weight:600;color:#5b7168}
  .chip{
    background:rgba(255,255,255,.75);border:1px solid #dbe7e1;color:#4a6159;
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
  }
  .chip:hover{background:#fff;border-color:#8ecfb4;color:#26805e}
  .layout{max-width:1180px;margin:18px auto 40px;padding:0 14px;display:grid;grid-template-columns:272px 1fr;gap:18px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} .side{order:2} }
  .side{
    background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;
    align-self:start; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow-y:auto;
  }
  @media (max-width:900px){ .side{position:static;max-height:none} }
  .side h3{margin:6px 6px 10px;font-size:14px;color:var(--sub);letter-spacing:.3px}
  .unit{margin-bottom:6px}
  .unit>button{
    width:100%;text-align:left;background:#f5faf8;border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);
  }
  .unit>button:hover{background:var(--brand-soft)}
  .unit ul{list-style:none;margin:4px 0 8px;padding:0 0 0 4px;display:none}
  .unit.open ul{display:block}
  .unit li{padding:5px 8px;font-size:14px;border-radius:7px;cursor:pointer;color:#35473f}
  .unit li:hover{background:var(--brand-soft);color:var(--brand)}
  .unit li.done::after{content:" ✓";color:var(--ok);font-weight:800}
  .unit li.cur{background:var(--brand);color:#fff}
  .progress{height:9px;background:#e9f1ed;border-radius:99px;overflow:hidden;margin:4px 6px 6px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,#5fc79b,#2f8f6b);width:0}
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:16px}
  @media (max-width:600px){ .card{padding:18px 15px} }
  .badge{display:inline-block;background:var(--brand-soft);color:var(--brand);font-size:12.5px;
    font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:8px}
  .badge.gray{background:#eef1f0;color:var(--sub)}
  h1.term{font-size:30px;margin:2px 0 4px;letter-spacing:-1px}
  .alias{color:var(--sub);font-size:13.5px;margin-bottom:14px}
  .oneline{
    background:linear-gradient(90deg,#fff9db,#fff4e6);border-left:5px solid #ffd43b;
    padding:14px 16px;border-radius:0 10px 10px 0;font-size:17px;font-weight:600;margin:0 0 18px;
  }
  h2.sec{font-size:16.5px;margin:26px 0 10px;padding-left:11px;border-left:4px solid var(--brand);letter-spacing:-.3px}
  .body p{margin:0 0 12px}
  .formula{
    background:#10231d;color:#e6f2ec;padding:14px 16px;border-radius:11px;margin:12px 0;
    font-size:17px;text-align:center;letter-spacing:.3px;line-height:2;
  }
  .formula .sm{display:block;font-size:13px;color:#8fb3a5;letter-spacing:0}
  .analogy{background:#e6fcf5;border:1px solid #b2f2e5;border-radius:11px;padding:14px 16px;margin:12px 0}
  .analogy b{color:#0b7285}
  .caution{background:#fff5f5;border:1px solid #ffc9c9;border-radius:11px;padding:14px 16px;margin:12px 0}
  .caution b{color:#c92a2a}
  ul.ex{margin:6px 0 0;padding-left:20px}
  ul.ex li{margin-bottom:7px}
  .simbox{background:#f5faf8;border:1px solid var(--line);border-radius:13px;padding:14px;margin:14px 0}
  .simhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
  .simhead b{font-size:14.5px}
  .simbtns button{
    border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;
    cursor:pointer;font-family:inherit;margin-left:6px;color:var(--sub);
  }
  .simbtns button:hover{background:var(--brand-soft);color:var(--brand)}
  .simcanvas{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px;display:block}
  .simctl{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:11px}
  .ctl{display:flex;align-items:center;gap:8px;font-size:13.5px;flex:1 1 260px}
  .ctl label{color:var(--sub);white-space:nowrap}
  .ctl input[type=range]{flex:1;min-width:90px;accent-color:var(--brand)}
  .ctl select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
  .ctl .val{font-weight:700;color:var(--brand);min-width:62px;text-align:right}
  .simnote{margin-top:11px;font-size:13.5px;color:#41564d;background:#fff;border:1px dashed #c9ded5;border-radius:9px;padding:10px 12px}
  .quiz{background:#f7fbf9;border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin:12px 0}
  .quiz .q{font-weight:700;margin-bottom:10px}
  .opt{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;cursor:pointer;font-size:14.5px}
  .opt:hover{border-color:#8ecfb4;background:var(--brand-soft)}
  .opt.right{background:#d3f9d8;border-color:#69db7c;font-weight:700}
  .opt.wrong{background:#ffe3e3;border-color:#ffa8a8}
  .why{display:none;margin-top:9px;font-size:14px;background:#fff;border-left:4px solid var(--brand);padding:10px 12px;border-radius:0 8px 8px 0;color:#3c534a}
  .rel span{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:999px;
    padding:6px 13px;margin:4px 6px 4px 0;font-size:14px;cursor:pointer;font-weight:600}
  .rel span:hover{background:var(--brand);color:#fff}
  .footbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
  .footbar button{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:9px;
    padding:9px 15px;font-size:14px;cursor:pointer;font-family:inherit}
  .footbar button:hover{background:var(--brand-soft);color:var(--brand);border-color:#8ecfb4}
  .footbar button.done{background:var(--ok);color:#fff;border-color:var(--ok)}
  .rescard{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;cursor:pointer}
  .rescard:hover{border-color:#8ecfb4;background:#f7fbf9}
  .rescard p{margin:5px 0 0;font-size:14px;color:var(--sub)}
  .empty{background:#fff9db;border:1px solid #ffe066;border-radius:12px;padding:16px;font-size:15px}
  .empty b{display:block;margin-bottom:6px}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;margin-top:14px}
  .home-unit{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fbfdfc}
  .home-unit h4{margin:0 0 8px;font-size:14.5px;color:var(--brand)}
  .home-unit span{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:4px 11px;margin:3px 5px 3px 0;font-size:13.5px;cursor:pointer}
  .home-unit span:hover{background:var(--brand-soft);border-color:#8ecfb4;color:var(--brand)}
  .copyright{max-width:1180px;margin:0 auto;padding:22px 16px 40px;font-size:12.5px;color:#7d8c85;text-align:center;line-height:1.9}
  .copyright b{display:block;color:#5a6b64;font-size:13px}
  .copyright span{display:block;font-size:11.5px;color:#98a5a0}
  @media print{
    header,.side,.footbar,.simbtns,#suggest{display:none}
    .layout{display:block} .card{box-shadow:none;border:1px solid #ccc}
  }
</style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<header>
  <div class="hwrap">
    <p class="htitle">🌏 통합과학2 기초 개념 사전</p>
    <p class="hsub">「고등학교 통합과학2」 기준 · 용어를 입력하면 <b>쉬운 설명 + 직접 움직여 보는 자료</b>가 나옵니다.</p>
    <div class="searchbar">
      <input id="q" type="text" placeholder="예: 중화 반응, 자연선택, 전자기 유도, ㅅㅎ (초성도 됩니다)" autocomplete="off">
      <button id="btnSearch">검색</button>
      <div id="suggest"></div>
    </div>
    <div class="chips" id="chips"><b>자주 찾는 용어</b></div>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <h3>교과서 차례로 찾기</h3>
    <div id="toc"></div>
    <h3 style="margin-top:14px">나의 학습 진도</h3>
    <div class="progress"><i id="bar" style="width:0%"></i></div>
    <div style="font-size:12.5px;color:var(--sub)" id="progtxt">0 / 0 개 이해 완료</div>
  </aside>
  <main id="main"></main>
</div>

<footer class="copyright">
  <b>Copyright © 2026 통합과학2 기초 개념 사전. All Rights Reserved (무단 전재 및 재배포 금지)</b>
  <span>본 자료의 내용은 저작권법의 보호를 받으며, 저작권자의 동의 없이 무단으로 복제·배포·전송·전시할 수 없습니다.</span>
</footer>

<script>
/* =========================================================
   [1] 시뮬레이션 엔진
   ========================================================= */
const SIM = {};
const TAU = Math.PI*2;

function bg(g,W,H,c){ g.fillStyle=c||'#ffffff'; g.fillRect(0,0,W,H); }
function line(g,x1,y1,x2,y2,c,w){ g.strokeStyle=c||'#333'; g.lineWidth=w||2; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }
function rect(g,x,y,w,h,c,r){ g.fillStyle=c; g.beginPath(); if(g.roundRect) g.roundRect(x,y,w,h,r||0); else g.rect(x,y,w,h); g.fill(); }
function orect(g,x,y,w,h,c,r,lw){ g.strokeStyle=c; g.lineWidth=lw||1.5; g.beginPath(); if(g.roundRect) g.roundRect(x,y,w,h,r||0); else g.rect(x,y,w,h); g.stroke(); }
function circle(g,x,y,r,c){ g.fillStyle=c; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); }
function ring(g,x,y,r,c,w){ g.strokeStyle=c; g.lineWidth=w||2; g.beginPath(); g.arc(x,y,r,0,TAU); g.stroke(); }
function txt(g,s,x,y,c,size,align,bold){
  g.fillStyle=c||'#1c2b26'; g.font=(bold?'bold ':'')+(size||13)+'px "Malgun Gothic",sans-serif';
  g.textAlign=align||'left'; g.textBaseline='middle'; g.fillText(s,x,y);
}
function arrow(g,x1,y1,x2,y2,c,w,head){
  const a=Math.atan2(y2-y1,x2-x1), h=head||9;
  line(g,x1,y1,x2,y2,c,w||2.5);
  g.fillStyle=c; g.beginPath();
  g.moveTo(x2,y2);
  g.lineTo(x2-h*Math.cos(a-0.4), y2-h*Math.sin(a-0.4));
  g.lineTo(x2-h*Math.cos(a+0.4), y2-h*Math.sin(a+0.4));
  g.closePath(); g.fill();
}
function axes(g,x,y,w,h,xl,yl){
  line(g,x,y,x,y-h,'#adb5bd',1.5); line(g,x,y,x+w,y,'#adb5bd',1.5);
  txt(g,xl,x+w,y+15,'#868e96',11,'right');
  txt(g,yl,x-2,y-h-9,'#868e96',11,'left');
}
function dash(g,x1,y1,x2,y2,c,w){ g.save(); g.setLineDash([5,4]); line(g,x1,y1,x2,y2,c||'#adb5bd',w||1.4); g.restore(); }
function bar(g,x,y,w,h,c,label,val){
  g.fillStyle=c; g.fillRect(x,y-h,w,h);
  if(label) txt(g,label,x+w/2,y+14,'#5a6b64',11.5,'center');
  if(val!==undefined) txt(g,val,x+w/2,y-h-10,c,11.5,'center',true);
}
function chipbox(g,x,y,w,h,fill,stroke,label,lc,fs){
  rect(g,x,y,w,h,fill,8); orect(g,x,y,w,h,stroke,8,1.4);
  txt(g,label,x+w/2,y+h/2,lc||'#1c2b26',fs||12.5,'center',true);
}
function wrapTxt(g,s,x,y,maxw,lh,c,size,align){
  g.font=(size||12)+'px "Malgun Gothic",sans-serif'; g.textAlign=align||'left'; g.textBaseline='middle'; g.fillStyle=c||'#5a6b64';
  const words=s.split(' '); let ln=''; let yy=y;
  for(let i=0;i<words.length;i++){
    const test = ln? ln+' '+words[i] : words[i];
    if(g.measureText(test).width>maxw && ln){ g.fillText(ln,x,yy); ln=words[i]; yy+=lh||15; }
    else ln=test;
  }
  if(ln) g.fillText(ln,x,yy);
  return yy;
}

function mountSim(host, id){
  const s = SIM[id]; if(!s) return;
  const W = s.w||660, H = s.h||300;
  const box = document.createElement('div'); box.className='simbox';
  const head = document.createElement('div'); head.className='simhead';
  head.innerHTML = '<b>🔬 '+(s.title||'직접 해 보기')+'</b>';
  const btns = document.createElement('div'); btns.className='simbtns';
  const bPlay = document.createElement('button'); bPlay.textContent='⏸ 멈춤';
  const bReset= document.createElement('button'); bReset.textContent='↺ 처음부터';
  btns.appendChild(bPlay); btns.appendChild(bReset); head.appendChild(btns);
  box.appendChild(head);

  const cv = document.createElement('canvas'); cv.className='simcanvas';
  cv.width = W*2; cv.height = H*2; cv.style.aspectRatio = W+'/'+H;
  box.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(2,2);

  const p = {}; (s.controls||[]).forEach(c=> p[c.key] = c.value);
  const ctl = document.createElement('div'); ctl.className='simctl';
  (s.controls||[]).forEach(c=>{
    const d = document.createElement('div'); d.className='ctl';
    if(c.type==='select'){
      d.innerHTML = '<label>'+c.label+'</label>';
      const sel = document.createElement('select');
      c.options.forEach(o=>{ const op=document.createElement('option'); op.value=o.v; op.textContent=o.t; sel.appendChild(op); });
      sel.value = c.value;
      sel.oninput = ()=>{ p[c.key] = (sel.value!=='' && !isNaN(+sel.value))? +sel.value : sel.value; if(!running) frame(); };
      d.appendChild(sel);
    } else {
      d.innerHTML = '<label>'+c.label+'</label>';
      const r = document.createElement('input'); r.type='range'; r.min=c.min; r.max=c.max; r.step=c.step||1; r.value=c.value;
      const v = document.createElement('span'); v.className='val';
      r.oninput = ()=>{ p[c.key]=+r.value; v.textContent=(+r.value).toFixed(c.fix||0)+(c.unit||''); if(!running) frame(); };
      v.textContent = (+c.value).toFixed(c.fix||0)+(c.unit||'');
      d.appendChild(r); d.appendChild(v);
    }
    ctl.appendChild(d);
  });
  if((s.controls||[]).length) box.appendChild(ctl);
  if(s.note){ const n=document.createElement('div'); n.className='simnote'; n.innerHTML='💡 '+s.note; box.appendChild(n); }
  host.appendChild(box);

  let t0 = performance.now(), running = true, raf = null, state = {};
  if(s.init) s.init(state,p);
  function frame(){
    const t = (performance.now()-t0)/1000;
    g.clearRect(0,0,W,H); bg(g,W,H,s.bgc||'#ffffff');
    try{ s.draw(g,p,t,W,H,state); }catch(e){ txt(g,'그림 오류: '+e.message,10,20,'#c00',12); }
  }
  function loop(){ if(!running) return; frame(); raf = requestAnimationFrame(loop); }
  bPlay.onclick = ()=>{ running=!running; bPlay.textContent = running?'⏸ 멈춤':'▶ 재생'; if(running){ loop(); } else if(raf) cancelAnimationFrame(raf); };
  bReset.onclick = ()=>{ t0=performance.now(); if(s.init) s.init(state,p); frame(); };
  if(s.anim===false){ running=false; bPlay.style.display='none'; frame(); }
  else loop();
  SIMRUN.push(()=>{ running=false; if(raf) cancelAnimationFrame(raf); });
}
let SIMRUN = [];
function stopSims(){ SIMRUN.forEach(f=>f()); SIMRUN=[]; }

/* =========================================================
   [2] 시뮬레이션 : Ⅰ. 변화와 다양성
   ========================================================= */

/* --- 화석으로 과거 환경 알기 --- */
SIM.fossil = {
  title:'화석을 보면 그때의 환경을 알 수 있어요', w:660, h:312, anim:false,
  controls:[{key:'k',label:'발견된 화석',type:'select',value:'coral',
    options:[{v:'coral',t:'산호 화석'},{v:'trilo',t:'삼엽충 화석'},{v:'fern',t:'양치식물 화석'},{v:'shell',t:'조개 화석'}]}],
  note:'화석은 <b>그 생물이 살던 환경</b>을 알려 주는 단서입니다. 지금 그 생물이 어디에 사는지를 보면, 과거 그 지역이 어떤 곳이었는지 짐작할 수 있어요.',
  draw(g,p,t,W,H){
    const D={
      coral:{n:'산호',now:'지금 산호는 따뜻하고 얕은 바다에 삽니다.',past:'과거 이 지역은 수온이 높고 수심이 얕은 바다',c:'#fa5252',era:'고생대~현재'},

    } else {
      txt(g,'남는 이온 없음 → 완전히 중화!',300,180,'#2f9e44',12.5,'left',true);

SIM.induction = {

    txt(g,'G',gx,gy+26,'#868e96',13,'center',true);
    let dirSign = 0;

    rect(g,30,76,180,16,'#e9ecef',6);
    rect(g,30,76,180*strength,16,'#2f8f6b',6);

  note:'종다양성은 <b>종의 수가 많을수록</b>, 그리고 <b>각 종의 개체수가 고르게 분포할수록</b> 높습니다. 두 가지를 모두 봐야 해요.',
  draw(g,p,t,W,H){
    const cols=['#e03131','#f59f00','#40c057','#4dabf7','#7950f2','#f06595'];
    const icons=['🐞','🦋','🐝','🐌','🦗','🕷️'];
    const e=p.e/100, n=p.n;
    // 개체수 배분 : e가 0이면 한 종 독점, 1이면 균등
    const w=[]; let tot=0;
    for(let i=0;i<n;i++){ const v = e + (1-e)*(i===0? n : 0.06); w.push(v); tot+=v; }
    const share=w.map(v=>v/tot);
    // 서식지 그림
    rect(g,30,44,600,110,'#f1f8f4',10); orect(g,30,44,600,110,'#c3ddd2',10,1.4);
    const slots=[]; for(let r=0;r<3;r++) for(let c=0;c<12;c++) slots.push([56+c*49, 66+r*32]);
    let slot=0;
    share.forEach((s,i)=>{
      const cnt=Math.max(1,Math.round(s*36));
      for(let k=0;k<cnt && slot<slots.length;k++,slot++){
        g.font='17px "Malgun Gothic"'; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#000';
        g.fillText(icons[i], slots[slot][0], slots[slot][1]);
      }
    });
    // 비율 막대
    let x=30;
    share.forEach((s,i)=>{ rect(g,x,172,600*s,22,cols[i],3); x+=600*s; });
    share.forEach((s,i)=> txt(g, icons[i]+' '+Math.round(s*100)+'%', 40+i*100, 210, cols[i],11.5,'left',true));
    // 지수
    let hIdx=0; share.forEach(s=>{ if(s>0) hIdx -= s*Math.log(s); });

    const c = lvl<0.35?'#e03131': lvl<0.7?'#f59f00':'#2f9e44';

      : '종의 수가 많고 개체수도 고르게 분포해 종다양성이 높습니다.';
    wrapTxt(g,msg,30,286,600,17,'#1c2b26',13.5);
  }

{unit:'I-1', name:'중생대', alias:['공룡','암모나이트','겉씨식물'],
 one:'전반적으로 따뜻했던 시대. 바다에는 암모나이트, 육지에는 공룡이 번성했다.',
 body:['중생대에는 전반적으로 기후가 <b>온난</b>했고, 초대륙 판게아가 <b>분리되면서</b> 수륙 분포가 변했습니다.',
  '고생대 말의 급격한 환경 변화에서 살아남은 생물이 새로운 환경에서 번성하기 시작했어요.',
  '바다에는 <b>암모나이트</b>가, 육지에는 다양한 종류의 <b>공룡</b>과 은행나무 같은 <b>겉씨식물</b>이 번성했습니다.',
  '중생대 말(약 0.66억 년 전)에는 다섯 번째 대멸종이 일어나 공룡과 암모나이트가 사라졌습니다. 소행성 충돌설이 가장 널리 알려져 있어요.'],
 analogy:'중생대는 <b>공룡의 전성기</b>였습니다. 고생대 말 대멸종으로 경쟁자가 크게 줄어든 빈자리를, 살아남은 파충류가 차지하며 크게 번성한 것이에요.',
 sim:'mesozoic',
 examples:['공룡 : 육상의 지배자','암모나이트 : 바다의 대표 화석','은행나무 같은 겉씨식물','판게아의 분리'],
 caution:'중생대에 <b>포유류가 없었던 것은 아닙니다</b>. 작은 크기로 이미 존재했지만, 공룡이 사라진 신생대에 들어서 크게 번성했어요.',
 quiz:[{q:'중생대에 번성한 생물끼리 바르게 짝지은 것은?',
   c:['공룡 – 암모나이트 – 겉씨식물','삼엽충 – 어류 – 양치식물','화폐석 – 포유류 – 속씨식물','남세균 – 다세포생물'],a:0,
   why:'중생대는 육지의 공룡·겉씨식물, 바다의 암모나이트가 대표적입니다.'}],
 rel:['고생대','신생대','대멸종','지질 시대']},

{unit:'I-1', name:'신생대', alias:['화폐석','포유류','속씨식물','빙하기','간빙기'],
 one:'지질 시대의 1.4 %밖에 안 되는 가장 짧고 가장 최근인 시대. 포유류와 인류의 시대.',
 body:['신생대는 초기부터 중기까지는 대체로 <b>온난</b>했지만, 말기에는 <b>빙하기와 간빙기가 반복</b>되었습니다.',
  '대륙의 이동과 분리가 계속되어 <b>오늘날과 비슷한 수륙 분포</b>를 이루게 되었습니다.',
  '바다에는 <b>화폐석</b>이, 육지에는 매머드 같은 <b>포유류</b>와 참나무 같은 <b>속씨식물</b>이 번성했어요.',
  '신생대 말기에 <b>인류의 조상</b>이 출현했고, 진화를 거듭해 지금의 모습에 이르렀습니다.'],
 analogy:'지질 시대를 하루로 보면, 신생대는 <b>밤 11시 40분 이후</b>입니다. 인류의 역사는 그중에서도 마지막 몇 초에 불과해요.',
 sim:'cenozoic',
 examples:['화폐석 : 신생대를 대표하는 바다 화석','매머드 : 빙하기의 대표 포유류','참나무 등 속씨식물의 번성','인류의 조상 출현'],
 caution:'<b>빙하기</b>는 기후가 한랭해 고위도나 산악 지대에 빙하가 발달한 시기이고, <b>간빙기</b>는 빙하기와 빙하기 사이의 온난한 시기입니다. 둘을 바꿔 쓰지 않도록 주의하세요.',
 quiz:[{q:'신생대에 대한 설명으로 옳지 않은 것은?',
   c:['공룡과 암모나이트가 번성하였다','말기에 빙하기와 간빙기가 반복되었다','화폐석이 번성하였다','인류의 조상이 출현하였다'],a:0,
   why:'공룡과 암모나이트는 중생대에 번성했고, 중생대 말 대멸종으로 사라졌습니다.'}],
 rel:['중생대','지질 시대','기후 변화']},

{unit:'I-1', name:'대멸종', alias:['멸종','mass extinction'],
 one:'지구 환경이 갑자기 변해서 많은 생물이 짧은 기간 동안 넓은 지역에서 한꺼번에 멸종하는 것.',
 body:['생물이 환경 변화에 적응하지 못하거나 다른 집단과의 경쟁에서 밀리면 <b>멸종</b>에 이를 수 있습니다.',
  '그중에서도 <b>지구 환경이 갑작스럽게 변화하여</b> 많은 생물이 짧은 기간 동안 광범위한 지역에서 멸종하는 것을 <b>대멸종</b>이라고 합니다.',
  '지질 시대 동안 대멸종은 <b>다섯 번</b> 일어난 것으로 알려져 있습니다. 원인을 설명하는 가설로는 <b>기후 변화설, 해양 무산소설, 화산 폭발설, 소행성 충돌설</b> 등이 있어요.',
  '대멸종이 일어나면 생물의 수가 크게 줄고 생물의 종류가 크게 달라집니다. 그런데 여기서 중요한 점! <b>대멸종에서 살아남아 새로운 환경에 적응한 생물은 오랜 시간에 걸쳐 다양한 종으로 진화</b>했습니다. 이 과정이 반복되면서 오늘날의 <b>생물다양성</b>이 만들어졌어요.'],
 analogy:'대멸종은 생물 세계의 <b>대규모 자리 바꾸기</b>입니다. 많은 자리가 비면 살아남은 생물이 그 자리를 채우며 새로운 방향으로 퍼져 나가요. 공룡이 사라진 뒤 포유류가 번성한 것이 대표적입니다.',
 sim:'massext',
 examples:['고생대 말(약 2.52억 년 전) 대멸종 : 규모가 가장 컸으며 삼엽충이 완전히 사라짐',
  '중생대 말(약 0.66억 년 전) 대멸종 : 공룡과 암모나이트 멸종 → 포유류 번성',
  '대멸종 이후 살아남은 생물이 다양한 종으로 진화 → 생물다양성 형성'],
 caution:'대멸종은 생물다양성을 <b>줄이기만 하는 사건이 아닙니다</b>. 살아남은 생물이 빈자리에서 다양하게 진화했기 때문에, 길게 보면 오늘날의 생물다양성을 만든 <b>중요한 계기</b>이기도 합니다.',
 quiz:[{q:'대멸종 이후에 나타나는 변화로 가장 알맞은 것은?',
   c:['살아남은 생물이 새 환경에 적응하며 다양한 종으로 진화한다','모든 생물이 사라져 생물이 없어진다','생물다양성이 영원히 회복되지 않는다','환경이 다시 원래대로 돌아간다'],a:0,
   why:'대멸종에서 살아남아 새로운 환경에 적응한 생물은 오랜 시간에 걸쳐 다양한 종으로 진화하여 생물다양성을 형성하였습니다.'}],
 rel:['지질 시대','고생대','중생대','생물다양성','진화']},

{unit:'I-1', name:'변이', alias:['형질의 차이','돌연변이','variation'],
 one:'같은 종의 개체 사이에 나타나는 형질(생김새·성질)의 차이.',
 body:['같은 종이라도 개체마다 조금씩 다릅니다. 도마뱀은 개체마다 앞다리 길이, 발바닥 넓이, 빨판 크기가 다르지요. 이렇게 <b>같은 종의 개체 사이에 나타나는 형질의 차이</b>를 <b>변이</b>라고 합니다.',
  '변이는 주로 개체가 가진 <b>유전자의 차이</b> 때문에 나타납니다. 그리고 유전자의 차이는 두 가지에서 생겨요.',
  '① <b>돌연변이</b> — DNA의 유전정보가 달라져 부모에게 없던 형질이 나타나는 현상. 오랫동안 축적됩니다.',
  '② <b>유성생식 과정에서 생식세포의 다양한 조합</b> — 암수로부터 각각 절반의 염색체를 다양한 조합으로 물려받기 때문에, 같은 부모에게서 태어난 형제자매도 서로 다릅니다.',
  '변이는 자연선택이 일어나기 위한 <b>출발점</b>입니다. 변이가 없으면 고를 것이 없으니 자연선택도 일어날 수 없어요.'],
 analogy:'같은 반 학생들의 키·발 크기가 조금씩 다른 것과 같습니다. 누가 더 좋고 나쁜 것이 아니라 <b>그냥 다양한 것</b>이고, 어떤 상황이 오느냐에 따라 유리한 형질이 달라집니다.',
 sim:'variation',
 examples:['무당벌레의 다양한 딱지날개 무늬와 색','기린의 털 무늬와 색','호랑나비의 날개 무늬와 색','같은 부모에게서 태어난 형제자매의 생김새 차이'],
 caution:'변이는 "환경 때문에 후천적으로 생긴 차이"가 아니라 <b>주로 유전자의 차이</b>로 나타납니다. 또한 <b>변이 = 돌연변이가 아닙니다</b>. 돌연변이는 변이가 생기는 원인 중 하나예요.',
 quiz:[{q:'변이가 생기는 원인으로 옳은 것을 모두 고르면?',
   c:['돌연변이와 유성생식에서 생식세포의 다양한 조합','열심히 운동해서 생긴 근육의 차이','환경에 맞추려는 생물의 의지','먹이의 종류에 따른 후천적 변화'],a:0,
   why:'변이는 주로 개체가 가진 유전자의 차이로 나타나며, 그 차이는 돌연변이와 유성생식 과정의 다양한 조합에서 생깁니다.'}],
 rel:['자연선택','진화','다윈의 자연선택설','유전적 다양성']},

{unit:'I-1', name:'자연선택', alias:['natural selection','자연 선택'],
 one:'환경에 적응하기 유리한 형질을 가진 개체가 더 잘 살아남아 자손을 더 많이 남기는 과정.',
 body:['자연 상태에서는 변이에 따라 개체마다 환경에 다르게 적응합니다.',
  '이때 <b>환경에 적응하기 유리한 형질</b>을 가진 개체는 그렇지 않은 개체보다 <b>더 잘 살아남아 자손을 더 많이 남깁니다</b>. 이 과정이 바로 <b>자연선택</b>이에요.',
  '자연선택된 개체의 형질은 자손에게 전달되므로, 세대가 지날수록 그 형질을 가진 <b>개체수가 증가</b>합니다.',
  '중요한 점 : <b>어떤 환경에서 유리한 형질이 다른 환경에서는 불리할 수 있습니다.</b> 빨간 도화지 위에서는 빨간 과자가 살아남지만, 초록 도화지로 바꾸면 초록 과자가 살아남는 것처럼요.'],
 analogy:'자연선택은 누가 "골라 주는 것"이 아니라 <b>환경이 자동으로 걸러 내는 것</b>입니다. 체를 흔들면 구멍보다 작은 것만 남듯이, 그 환경에 맞는 개체만 남는 거예요.',
 sim:'natsel',
 examples:['포식자 눈에 덜 띄는 색을 가진 개체가 더 많이 살아남음',
  '높은 곳의 잎을 먹기 유리한 목이 긴 기린이 살아남음',
  '섬의 먹이에 맞는 부리를 가진 핀치가 살아남음',
  '항생제를 이겨 내는 세균만 살아남아 늘어나는 것'],
 caution:'"목이 길어지려고 <b>노력해서</b> 길어졌다"는 설명은 틀립니다(라마르크의 용불용설). 자연선택설에서는 <b>원래 다양한 변이가 있었고, 그중 유리한 것이 살아남았다</b>고 봅니다.',
 quiz:[{q:'빨간색 도화지 위에서 실험하다가 초록색 도화지로 바꾸었습니다. 예상되는 결과는?',
   c:['살아남는 과자의 색이 초록색 위주로 바뀐다','계속 빨간색 과자만 살아남는다','모든 색이 똑같이 살아남는다','과자의 색이 초록색으로 변한다'],a:0,
   why:'어떤 환경에서 유리한 형질이 다른 환경에서는 불리하게 작용하여 자연선택의 결과가 달라집니다.'}],
 rel:['변이','진화','다윈의 자연선택설','생물다양성']},

{unit:'I-1', name:'진화', alias:['evolution'],
 one:'오랜 시간 동안 여러 세대를 거치면서 생물이 변화하는 현상.',
 body:['수십억 년의 지질 시대를 거치면서 지구 환경은 끊임없이 변했고, 생물도 여기에 적응하며 계속 변해 왔습니다.',
  '이처럼 <b>오랜 시간 동안 여러 세대를 거치면서 생물이 변화하는 현상</b>을 <b>진화</b>라고 합니다.',
  '진화의 기본 원리는 <b>변이 + 자연선택</b>입니다. 다양한 변이가 있고, 그중 환경에 유리한 것이 자연선택되어 자손에게 전달되는 과정이 오래 반복되면 생물이 변하는 거예요.',
  '지구 생태계의 다양한 환경에서 생물은 <b>서로 다른 방향으로</b> 자연선택되었습니다. 이 과정이 오랫동안 반복되어 현재와 같이 <b>생물종이 다양해졌습니다</b>.'],
 analogy:'진화는 개체 한 마리가 변하는 것이 아니라 <b>집단의 구성 비율이 서서히 바뀌는 것</b>입니다. 한 학생의 키가 크는 것이 아니라, 반 전체의 평균 키가 세대를 거치며 달라지는 것에 가까워요.',
 sim:'whale',
 examples:['고래의 진화 : 네 다리로 걷던 육상동물 → 물갈퀴가 있는 단계 → 바다에 완전히 적응',
  '기린의 목이 길어진 과정','갈라파고스 핀치가 여러 종으로 나뉜 과정'],
 caution:'진화는 <b>"더 좋아지는 것"이 아닙니다</b>. 그 환경에 맞게 달라지는 것일 뿐이고, 환경이 바뀌면 유리했던 형질이 불리해지기도 합니다. 또한 진화는 <b>개체가 아니라 집단(무리)에서</b> 일어납니다.',
 quiz:[{q:'진화에 대한 설명으로 옳은 것은?',
   c:['오랜 시간 여러 세대를 거치며 생물 집단이 변화하는 현상이다','한 개체가 살아 있는 동안 몸이 변하는 것이다','생물이 항상 더 완벽해지는 과정이다','환경과 관계없이 일어나는 현상이다'],a:0,
   why:'진화는 개체가 아니라 집단에서, 여러 세대에 걸쳐 일어나는 변화입니다.'}],
 rel:['변이','자연선택','다윈의 자연선택설','생물다양성','대멸종']},

{unit:'I-1', name:'다윈의 자연선택설', alias:['자연선택설','과잉 생산','생존경쟁','종의 기원','다윈'],
 one:'과잉 생산 → 변이 → 생존경쟁 → 자연선택 → 진화. 다윈이 생물의 진화를 설명한 이론.',
 body:['다윈은 1859년 『종의 기원』에서 <b>자연선택설</b>을 주장하며 생물의 진화를 설명했습니다. 순서를 따라가 봅시다.',
  '① <b>과잉 생산</b> — 생물은 주어진 환경에서 살아남을 수 있는 것보다 <b>훨씬 많은 수의 자손</b>을 낳습니다.',
  '② <b>변이</b> — 과잉 생산된 개체들 사이에 다양한 변이가 나타납니다.',
  '③ <b>생존경쟁</b> — 먹이·서식지·배우자 등을 차지하기 위해 개체 사이에 경쟁이 일어납니다.',
  '④ <b>자연선택</b> — 환경에 적응하기 유리한 형질을 가진 개체가 살아남아 자손을 남길 확률이 큽니다.',
  '⑤ <b>진화</b> — 유리한 형질을 가진 개체의 비율이 늘어나고, 이 과정이 반복되어 생물이 진화합니다.'],
 analogy:'"많이 낳고(과잉 생산) → 서로 다르고(변이) → 경쟁하고(생존경쟁) → 맞는 것만 남고(자연선택) → 결국 달라진다(진화)". <b>과·변·생·자·진</b>으로 외워 보세요.',
 sim:'giraffe',
 examples:['기린 : 목 길이가 다양했음 → 높은 잎을 먹으려는 경쟁 → 목이 긴 개체가 생존 → 목이 긴 기린이 번성',
  '갈라파고스 핀치 : 섬마다 먹이가 달라 부리 모양이 다른 여러 종으로 분화'],
 caution:'라마르크의 <b>용불용설</b>("많이 쓰면 발달하고 그것이 자손에게 전해진다")과 헷갈리지 마세요. 자연선택설은 <b>처음부터 다양했던 변이 중 유리한 것이 남은 것</b>이라고 설명합니다.',
 quiz:[{q:'다윈의 자연선택설의 순서로 옳은 것은?',
   c:['과잉 생산 → 변이 → 생존경쟁 → 자연선택 → 진화','생존경쟁 → 과잉 생산 → 진화 → 변이','변이 → 진화 → 자연선택 → 생존경쟁','자연선택 → 변이 → 과잉 생산 → 진화'],a:0,
   why:'과잉 생산된 자손 사이에 변이가 나타나고, 생존경쟁을 거쳐 유리한 개체가 자연선택되며, 이 과정이 반복되어 진화합니다.'}],
 rel:['변이','자연선택','진화','생물다양성']},

{unit:'I-1', name:'생물다양성', alias:['biodiversity','생물 다양성'],
 one:'유전적 다양성 + 종다양성 + 생태계다양성을 모두 포함하는 개념.',
 body:['<b>생물다양성</b>은 세 가지를 모두 포함하는 개념입니다.',
  '① <b>유전적 다양성</b> — 생물이 지닌 유전자의 다양성',
  '② <b>종다양성</b> — 일정한 지역에서 관찰되는 생물종의 다양성',
  '③ <b>생태계다양성</b> — 생물이 서식하는 생태계의 다양성',
  '이 셋은 서로 연결되어 있습니다. 한 집단의 <b>유전적 다양성이 높으면 종다양성이 높아지고</b>, 종다양성은 생태계의 다양성을 안정적으로 유지하는 원천이 됩니다. 또 <b>생태계가 다양할수록</b> 종다양성과 유전적 다양성도 높아져요.',
  '생물다양성이 중요한 까닭은? 생명은 그 자체로 소중하다는 <b>본질적 가치</b> 외에도, ① 다양한 생물이 <b>생태계를 안정적으로 유지</b>하고, ② 생물다양성이 높을수록 활용할 수 있는 <b>생물자원이 풍부</b>해지기 때문입니다.'],
 analogy:'생물다양성은 <b>여러 종류의 재료가 가득한 창고</b>와 같습니다. 재료가 다양할수록 어떤 상황이 와도 대응할 수 있고, 만들 수 있는 것도 많아집니다.',
 sim:['biodiv','finch'],
 examples:['생물자원 : 쌀·옥수수(식량), 병충해 저항 유전자(새 농작물 개발), 숲·호수(휴식과 문화 공간)',
  '유전적 다양성이 높은 작물은 병이 돌아도 전멸하지 않음',
  '먹이 관계가 복잡한 생태계일수록 평형이 잘 유지됨'],
 caution:'생물다양성은 <b>"종의 수"만을 뜻하지 않습니다</b>. 유전적 다양성·종다양성·생태계다양성을 <b>모두</b> 포함하는 개념이라는 점을 꼭 기억하세요.',
 quiz:[{q:'생물다양성에 포함되는 세 가지 요소는?',
   c:['유전적 다양성, 종다양성, 생태계다양성','유전적 다양성, 개체수, 생체량','종다양성, 먹이그물, 영양단계','종다양성, 생태계평형, 생물자원'],a:0,
   why:'생물다양성은 유전적 다양성, 종다양성, 생태계다양성을 모두 포함하는 개념입니다.'}],
 rel:['유전적 다양성','종다양성','생태계다양성','생물다양성 보전','진화','대멸종']},

{unit:'I-1', name:'유전적 다양성', alias:['유전자 다양성','genetic diversity'],
 one:'같은 종 안에서 형질을 결정하는 유전자가 얼마나 다양한지를 나타내는 정도.',
 body:['<b>유전적 다양성</b>은 같은 종에서 형질을 결정하는 <b>유전자가 다양한 정도</b>입니다.',
  '같은 종이어도 개체마다 유전자가 달라 다양한 형질이 나타나는 것을 뜻해요.',
  '유전적 다양성이 <b>높으면</b> 환경이 갑자기 변하거나 전염병이 돌아도 <b>살아남는 개체가 있을 가능성이 큽니다</b>. 그래서 그 종이 멸종할 위험이 줄어들어요.',
  '반대로 유전적 다양성이 <b>낮으면</b> 모두 비슷하기 때문에, 한 번의 환경 변화로 집단 전체가 위험해질 수 있습니다.'],
 analogy:'시험 문제를 푸는 방법을 <b>한 가지만 아는 반</b>과 <b>여러 가지 아는 반</b> 중, 문제 유형이 갑자기 바뀌면 어느 쪽이 유리할까요? 유전적 다양성이 높다는 것은 여러 가지 방법을 가지고 있다는 뜻입니다.',
 sim:'geneDiv',
 examples:['같은 종 달팽이의 껍데기 무늬와 색이 여러 가지인 것','무당벌레의 딱지날개 무늬가 개체마다 다른 것','같은 품종 감자라도 유전적으로 똑같으면 병에 한꺼번에 걸릴 수 있음'],
 caution:'유전적 다양성은 <b>같은 종 안에서</b>의 다양성입니다. 여러 종이 사는 것을 뜻하는 <b>종다양성</b>과 반드시 구별하세요.',
 quiz:[{q:'유전적 다양성이 낮은 집단에서 나타날 수 있는 문제는?',
   c:['환경이 갑자기 변하면 집단 전체가 위험해질 수 있다','종의 수가 지나치게 많아진다','생태계가 너무 복잡해진다','먹이그물이 단순해지지 않는다'],a:0,
   why:'개체들이 유전적으로 비슷하면 특정 환경 변화나 질병에 다 함께 취약해집니다.'}],
 rel:['생물다양성','종다양성','생태계다양성','변이']},

{unit:'I-1', name:'종다양성', alias:['종 다양성','species diversity'],
 one:'일정한 지역에 사는 생물종이 얼마나 다양한지를 나타내는 정도.',
 body:['<b>종다양성</b>은 일정한 지역에 사는 <b>생물종의 다양한 정도</b>입니다.',
  '종의 <b>수가 많을수록</b>, 그리고 각 종의 <b>개체수가 고르게 분포</b>할수록 종다양성이 높다고 합니다.',
  '종다양성이 높으면 먹이 관계가 복잡해져 <b>생태계평형이 잘 유지</b>됩니다. 한 종이 사라져도 다른 종이 그 역할을 대신할 수 있기 때문이에요.',
  '종다양성은 생태계의 다양성을 안정적으로 유지하는 <b>원천</b>이 됩니다.'],
 analogy:'나무만 잔뜩 있는 숲보다, 나무·꽃·버섯·나비·새·곤충이 함께 있는 숲이 종다양성이 높습니다. 후자가 훨씬 <b>튼튼한 숲</b>이에요.',
 sim:'spDiv',
 examples:['한 종만 심은 밭 vs 여러 작물이 섞인 밭','고창습지 : 수달·황새·팔색조 등 멸종 위기종을 포함해 다양한 생물종이 살고 있음'],
 caution:'종의 수만 많다고 종다양성이 높은 것은 아닙니다. <b>각 종의 개체수가 고르게 분포</b>하는 것도 중요합니다.',
 quiz:[{q:'A 지역에는 나무 6그루만, B 지역에는 나무·꽃·버섯·나비·새·무당벌레가 각각 있습니다. 옳은 설명은?',
   c:['B 지역의 종다양성이 더 높다','A 지역의 종다양성이 더 높다','두 지역의 종다양성은 같다','종다양성은 개체수로만 결정된다'],a:0,
   why:'B 지역이 생물종의 수가 많고 고르게 분포하므로 종다양성이 높습니다.'}],
 rel:['생물다양성','유전적 다양성','생태계다양성','생태계평형']},

{unit:'I-1', name:'생태계다양성', alias:['생태계 다양성','ecosystem diversity'],
 one:'어느 지역에 존재하는 생태계가 얼마나 다양한지를 나타내는 정도.',
 body:['<b>생태계다양성</b>은 어느 지역에 존재하는 <b>생태계의 다양한 정도</b>입니다.',
  '사막, 초원, 삼림, 강, 바다, 갯벌, 습지처럼 <b>서로 다른 생태계가 여럿 존재하는 것</b>을 의미해요.',
  '생태계가 다양할수록 그 안에 사는 <b>종다양성과 유전적 다양성도 함께 높아집니다</b>. 환경이 다양하면 그에 적응한 생물도 다양해지기 때문이에요.'],
 analogy:'생태계다양성은 <b>여러 종류의 집(서식지)이 있는 마을</b>과 같습니다. 아파트만 있는 곳보다 아파트·주택·한옥이 섞인 곳에 더 다양한 사람이 살 수 있는 것과 비슷해요.',
 sim:'ecoDiv',
 examples:['사막·초원·삼림·강·바다 등 다양한 생태계가 존재하는 것','습지가 사라지면 그 습지에만 살던 생물도 함께 사라짐'],
 caution:'생태계다양성이 줄어들면(예: 습지 매립, 삼림 파괴) <b>그 안의 종다양성과 유전적 다양성도 함께 줄어듭니다</b>. 세 가지는 따로 노는 개념이 아니에요.',
 quiz:[{q:'생태계다양성에 해당하는 설명은?',
   c:['사막, 초원, 삼림, 강, 바다 등 다양한 생태계가 존재하는 것','같은 종의 유전자가 다양한 것','한 지역에 사는 생물종이 다양한 것','한 개체군의 개체수가 많은 것'],a:0,
   why:'생태계다양성은 어느 지역에 존재하는 생태계의 다양한 정도를 뜻합니다.'}],
 rel:['생물다양성','종다양성','유전적 다양성','생태계']},

{unit:'I-1', name:'생물다양성 보전', alias:['서식지단편화','남획','외래생물','생태통로','생물자원','생물다양성 감소'],
 one:'생물다양성이 줄어드는 원인을 줄이고, 서식지를 되살려 다양한 생물을 지키려는 노력.',
 body:['최근 생물다양성이 빠르게 줄고 있는데, 그 원인은 대부분 <b>인간의 활동</b>과 관련이 깊습니다. 주요 원인은 다음 네 가지예요.',
  '① <b>서식지 파괴 및 단편화</b> — 도로 건설, 주택 개발 등으로 큰 서식지가 작게 나뉘는 것(<b>서식지단편화</b>)',
  '② <b>불법 포획과 남획</b> — 사냥·고기잡이로 생물을 과도하게 많이 잡는 행위',
  '③ <b>환경 오염과 기후 변화</b>',
  '④ <b>외래생물의 유입</b>',
  '보전을 위한 노력으로는 서식지 복원·보존, 단편화된 서식지를 잇는 <b>생태통로</b> 설치, 불법 포획·남획 금지, 환경 오염 방지 및 기후 변화 대책 시행, 외래생물 도입 전 영향 검증 등이 있습니다.',
  '노력은 세 가지 차원으로 나눌 수 있어요. <b>개인적</b>(쓰레기 분리수거) · <b>사회적</b>(생태통로 설치) · <b>국제적</b>(생물다양성협약 체결).'],
 analogy:'생태통로는 도로 때문에 갈라진 숲을 이어 주는 <b>동물 전용 육교</b>입니다. 길이 끊기면 이웃 마을에 갈 수 없어 친구도 못 만나듯이, 서식지가 끊기면 동물도 짝을 만나기 어려워져요.',
 sim:'habitat',
 examples:['생태통로 설치(사회적 노력)','천연기념물·국립 공원 지정','생물다양성협약 체결(국제적 노력)','쓰레기 분리수거(개인적 노력)',
  '고창습지 : 도로를 차단하고 탐방로를 조성해 습지를 복원한 사례'],
 caution:'<b>서식지 파괴</b>와 <b>서식지단편화</b>는 다릅니다. 단편화는 서식지가 없어진 것이 아니라 <b>작게 나뉜 것</b>인데, 이동이 막혀 유전적 다양성이 낮아지는 심각한 문제를 일으킵니다.',
 quiz:[{q:'생물다양성이 감소하는 주요 원인으로 보기 어려운 것은?',
   c:['생태통로 설치','서식지 파괴 및 단편화','불법 포획과 남획','외래생물의 유입'],a:0,
   why:'생태통로 설치는 생물다양성을 보전하기 위한 노력입니다.'}],
 rel:['생물다양성','종다양성','생태계보전','기후 변화']}
);

TERMS.push(
{unit:'I-2', name:'산화', alias:['oxidation','산화 반응'],
 one:'물질이 산소를 얻거나 전자를 잃는 반응.',
 body:['<b>산화</b>를 설명하는 방법은 두 가지입니다.',
  '① <b>산소의 이동으로 보기</b> — 화학 반응이 일어날 때 물질이 <b>산소를 얻는</b> 반응이 산화입니다. 산화 구리(Ⅱ)와 탄소를 섞어 가열하면, 탄소가 산소를 얻어 이산화 탄소가 됩니다(탄소가 산화됨).',
  '② <b>전자의 이동으로 보기</b> — 물질이 <b>전자를 잃는</b> 반응이 산화입니다. 마그네슘을 태우면 마그네슘(Mg)이 전자를 잃고 마그네슘 이온(Mg²⁺)이 되지요.',
  '전자의 이동으로 정의하면, <b>산소가 등장하지 않는 반응도</b> 산화·환원으로 설명할 수 있습니다. 질산 은 수용액에 구리 선을 넣으면 구리가 전자를 잃고 산화되어 구리 이온이 되고 수용액이 푸르게 변해요.',
  '핵심! <b>산화와 환원은 항상 동시에 일어납니다.</b> 누군가 산소를 얻으려면 산소를 잃는 물질이 있어야 하고, 누군가 전자를 잃으면 그 전자를 얻는 물질이 있어야 하니까요.'],
 analogy:'"<b>잃산얻환</b>" — 전자를 <b>잃</b>으면 <b>산</b>화, <b>얻</b>으면 <b>환</b>원. 산소는 반대로 "<b>얻산잃환</b>"입니다.',
 formula:['2CuO + C → 2Cu + CO₂<span class="sm">탄소 : 산소를 얻음 → 산화 / 산화 구리(Ⅱ) : 산소를 잃음 → 환원</span>',
  '2Mg + O₂ → 2MgO<span class="sm">마그네슘 : 전자를 잃음 → 산화 / 산소 : 전자를 얻음 → 환원</span>'],
 sim:['redoxO','redoxE'],
 examples:['철이 녹스는 것','사과의 갈변','메테인의 연소','광합성에서 물이 산소로 되는 부분','철의 제련에서 일산화 탄소가 이산화 탄소가 되는 것'],
 caution:'산화는 "산소와 결합하는 것"이라고만 외우면 안 됩니다. <b>전자를 잃는 것</b>도 산화예요. 그래야 산소가 없는 반응(구리 + 질산 은 수용액)도 설명할 수 있습니다.',
 quiz:[{q:'2Mg + O₂ → 2MgO 반응에서 산화되는 물질은?',
   c:['마그네슘(Mg) — 산소를 얻고 전자를 잃음','산소(O₂) — 전자를 얻음','산화 마그네슘(MgO)','산화되는 물질이 없다'],a:0,
   why:'마그네슘은 산소를 얻고 전자를 잃으므로 산화되고, 산소는 전자를 얻으므로 환원됩니다.'}],
 rel:['환원','산화·환원 반응의 이용','광합성']},

{unit:'I-2', name:'환원', alias:['reduction','환원 반응'],
 one:'물질이 산소를 잃거나 전자를 얻는 반응.',
 body:['<b>환원</b>은 산화의 반대입니다. 물질이 <b>산소를 잃거나</b> <b>전자를 얻는</b> 반응이에요.',
  '산화 구리(Ⅱ)와 탄소를 가열하면 검은색 산화 구리(Ⅱ)가 산소를 잃고 붉은색 <b>구리</b>가 됩니다. 산화 구리(Ⅱ)가 환원된 것이죠.',
  '마그네슘의 연소에서는 산소(O)가 전자를 얻어 산화 이온(O²⁻)이 됩니다. 산소가 환원된 것입니다.',
  '다시 강조하면, <b>산화와 환원은 항상 동시에</b> 일어납니다. 반응식에서 산화되는 물질을 찾았다면 반드시 환원되는 물질도 있어요.'],
 analogy:'산화·환원은 <b>주고받기</b>입니다. 물건(산소 또는 전자)을 주는 쪽이 있으면 반드시 받는 쪽이 있어요. 혼자서 산화만 일어나는 일은 없습니다.',
 formula:['Fe₂O₃ + 3CO → 2Fe + 3CO₂<span class="sm">산화 철(Ⅲ) : 산소를 잃음 → 환원 / 일산화 탄소 : 산소를 얻음 → 산화</span>'],
 sim:'agcu',
 examples:['철의 제련에서 산화 철(Ⅲ)이 철이 되는 것','고려청자의 푸른색 : 가마 안에서 철 이온이 환원되어 나타남','광합성에서 이산화 탄소가 포도당이 되는 것'],
 caution:'"환원"이라는 말에 "줄어든다"는 뜻이 있어 헷갈리기 쉽습니다. 실제로는 <b>산소를 잃거나 전자를 얻는 것</b>입니다. 전자를 <b>얻는</b>데 환원이라는 점을 꼭 기억하세요.',
 quiz:[{q:'철의 제련(Fe₂O₃ + 3CO → 2Fe + 3CO₂)에서 환원되는 물질은?',
   c:['산화 철(Ⅲ)','일산화 탄소','이산화 탄소','철'],a:0,
   why:'산화 철(Ⅲ)이 산소를 잃어 철이 되므로 환원되고, 일산화 탄소는 산소를 얻어 이산화 탄소가 되므로 산화됩니다.'}],
 rel:['산화','산화·환원 반응의 이용']},

{unit:'I-2', name:'산화·환원 반응의 이용', alias:['철의 제련','화석 연료의 연소','수소 연료 전지','연소','광합성','산화환원'],
 one:'광합성·철의 제련·화석 연료의 연소 등 자연과 인류의 역사를 바꾼 반응은 모두 산화·환원 반응이다.',
 body:['자연과 인류의 역사에 큰 변화를 가져온 화학 반응들은 <b>산소가 이동한다</b>는 공통점이 있습니다.',
  '<b>① 광합성</b> — 원시 바다에서 남세균이 최초로 광합성을 하며 산소를 만들었습니다. 산소는 바닷속 철과 결합한 뒤 대기로 방출되었고, 결국 산소 호흡으로 에너지를 얻는 생물이 등장했어요.',
  '<b>② 철의 제련</b> — 자연에서 철은 주로 산화 철로 존재합니다. 산화 철에서 산소를 떼어 내는 과정이 철의 제련이에요. 인류는 철로 무기·농기구를 만들며 <b>철기 시대</b>를 맞았습니다.',
  '<b>③ 화석 연료의 연소</b> — 화석 연료가 산소와 결합하며 에너지를 방출합니다. 18세기 후반 석탄을 쓰는 증기 기관과 증기 기관차가 발명되어 <b>산업혁명</b>이 일어났어요.',
  '이 밖에 <b>수소 연료 전지</b>(수소 자동차·우주선의 에너지원), <b>연소</b>(난방·조리), <b>에칭 판화</b>, <b>고려청자의 푸른색</b>도 산화·환원 반응을 이용한 것입니다.'],
 analogy:'산화·환원 반응은 <b>역사를 움직인 엔진</b>이었습니다. 산소를 만든 반응(광합성)이 생명의 역사를, 산소를 떼어 낸 반응(제련)과 붙인 반응(연소)이 인류 문명의 역사를 바꾸었어요.',
 sim:'redoxUse',
 examples:['철의 제련 → 철기 시대','화석 연료의 연소 → 산업혁명','광합성 → 대기 중 산소 축적, 산소 호흡 생물 출현','수소 연료 전지 → 수소 자동차','사과의 갈변, 자물쇠의 녹, 반딧불이의 빛'],
 caution:'광합성·제련·연소가 서로 완전히 다른 반응처럼 보이지만, <b>산소가 이동한다</b>는 점에서 모두 같은 종류의 반응입니다. 이 "공통점"을 묻는 문제가 자주 나와요.',
 quiz:[{q:'광합성, 철의 제련, 화석 연료의 연소에 공통적으로 관여하는 원소는?',
   c:['산소','질소','탄소','수소'],a:0,
   why:'세 반응은 모두 산소가 이동하는 산화·환원 반응입니다.'}],
 rel:['산화','환원','광합성','물질 변화와 에너지의 출입']},

{unit:'I-2', name:'산', alias:['acid','산성'],
 one:'수용액에서 수소 이온(H⁺)을 내놓는 물질.',
 body:['묽은 염산, 레몬즙, 식초 같은 <b>산 수용액</b>은 공통된 성질을 나타냅니다. 이 성질을 <b>산성</b>이라고 해요.',
  '산성의 성질 : ① 푸른색 리트머스 종이를 <b>붉게</b> 변화시킴, ② 금속(마그네슘·철)과 반응해 <b>수소 기체</b> 발생, ③ 탄산 칼슘(달걀 껍데기)과 반응해 <b>이산화 탄소 기체</b> 발생, ④ 수용액에 전류가 흐름.',
  '왜 서로 다른 물질인데 공통 성질이 나타날까요? 염화 수소·아세트산·질산·황산은 물에 녹으면 모두 <b>수소 이온(H⁺)</b>을 내놓기 때문입니다.',
  '그래서 <b>산은 수용액에서 수소 이온(H⁺)을 내놓는 물질</b>이라고 정의합니다.',
  '실험으로도 확인할 수 있어요. 푸른색 리트머스 종이 위에 묽은 염산에 적신 실을 올리고 전류를 흘리면, 색이 <b>(−)극 쪽으로</b> 붉게 번집니다. 즉 산성은 <b>양이온</b> 때문에 나타나는 것이죠.'],
 analogy:'산은 저마다 이름은 달라도(염산·황산·아세트산) 모두 <b>H⁺라는 같은 명찰</b>을 달고 있습니다. 그래서 공통된 성질이 나타나요.',
 formula:['HCl → H⁺ + Cl⁻<span class="sm">염화 수소는 물에 녹아 수소 이온을 내놓습니다</span>'],
 sim:['acidProp','ionizeAcid'],
 examples:['묽은 염산, 식초(아세트산), 레몬즙(시트르산), 탄산음료(탄산)','위산, 산성비'],
 caution:'염화 수소(HCl)는 <b>기체</b>이고, 이것을 물에 녹인 수용액이 <b>염산</b>입니다. 또 산성은 <b>음이온이 아니라 양이온(H⁺)</b> 때문이라는 점을 기억하세요.',
 quiz:[{q:'산 수용액의 공통된 성질이 나타나는 까닭은?',
   c:['공통으로 수소 이온(H⁺)을 내놓기 때문','공통으로 수산화 이온(OH⁻)을 내놓기 때문','모두 금속을 포함하기 때문','모두 신맛이 나기 때문'],a:0,
   why:'산은 물에 녹아 이온화하면서 공통으로 수소 이온을 내놓기 때문에 공통 성질(산성)이 나타납니다.'}],
 rel:['염기','중화 반응','중화열','중화 반응의 이용']},

{unit:'I-2', name:'염기', alias:['base','염기성','알칼리'],
 one:'수용액에서 수산화 이온(OH⁻)을 내놓는 물질.',
 body:['수산화 나트륨 수용액, 제빵 소다 수용액, 하수구 세정제 같은 <b>염기 수용액</b>이 공통으로 나타내는 성질을 <b>염기성</b>이라고 합니다.',
  '염기성의 성질 : ① 붉은색 리트머스 종이를 <b>푸르게</b> 변화시킴, ② 대부분의 금속과 <b>반응하지 않음</b>, ③ <b>단백질을 녹임</b>(그래서 미끈미끈함), ④ 수용액에 전류가 흐름.',
  '수산화 나트륨·수산화 칼슘·수산화 칼륨·수산화 바륨은 물에 녹으면 모두 <b>수산화 이온(OH⁻)</b>을 내놓습니다. 그래서 <b>염기는 수용액에서 수산화 이온을 내놓는 물질</b>입니다.',
  '붉은색 리트머스 종이 위에 수산화 나트륨 수용액에 적신 실을 올리고 전류를 흘리면 색이 <b>(+)극 쪽으로</b> 푸르게 번집니다. 즉 염기성은 <b>음이온</b> 때문이에요.'],
 analogy:'염기는 모두 <b>OH⁻라는 같은 명찰</b>을 달고 있습니다. 산이 H⁺ 명찰이라면, 염기는 OH⁻ 명찰이에요.',
 formula:['NaOH → Na⁺ + OH⁻<span class="sm">수산화 나트륨은 물에 녹아 수산화 이온을 내놓습니다</span>'],
 sim:['baseProp','ionizeBase'],
 examples:['수산화 나트륨 수용액, 제빵 소다 수용액, 하수구 세정제','비누, 치약, 제산제','석회 가루, 석회석'],
 caution:'"염기는 단백질을 녹인다"는 성질 때문에 <b>피부에 묻으면 미끈거리고 위험합니다</b>. 하수구 세정제로 머리카락(단백질)을 녹이는 것도 이 성질을 이용한 것이에요.',
 quiz:[{q:'염기 수용액의 성질로 옳지 않은 것은?',
   c:['금속과 반응하여 수소 기체를 발생시킨다','붉은색 리트머스 종이를 푸르게 변화시킨다','단백질을 녹인다','수용액에 전류가 흐른다'],a:0,
   why:'금속과 반응해 수소 기체를 발생시키는 것은 산의 성질입니다. 염기는 대부분의 금속과 반응하지 않습니다.'}],
 rel:['산','중화 반응','중화열','중화 반응의 이용']},

{unit:'I-2', name:'지시약', alias:['리트머스','페놀프탈레인','BTB','메틸 오렌지','액성'],
 one:'용액의 액성(산성·중성·염기성)에 따라 색이 변하는 물질.',
 body:['<b>지시약</b>은 용액의 액성에 따라 색이 변하는 물질입니다. 눈으로 액성을 쉽게 구분할 수 있게 해 줘요.',
  '<b>리트머스 종이</b> : 산성은 푸른색 → 붉은색, 염기성은 붉은색 → 푸른색으로 바꿉니다.',
  '<b>페놀프탈레인 용액</b> : 산성·중성에서는 무색, 염기성에서만 <b>붉은색</b>이 됩니다.',
  '<b>BTB 용액</b> : 산성 <b>노란색</b>, 중성 <b>초록색</b>, 염기성 <b>파란색</b>. 세 액성을 한 번에 구분할 수 있어 중화 반응 실험에 많이 씁니다.',
  '<b>메틸 오렌지 용액</b> : 강한 산성에서 붉은색, 그 밖에는 노란색을 띱니다.'],
 analogy:'지시약은 용액의 성질을 <b>색으로 알려 주는 신호등</b>입니다. BTB 용액은 노랑–초록–파랑 세 가지 신호를 보여 주는 가장 친절한 신호등이에요.',
 sim:'indicator',
 examples:['골든 로드 종이 : 산성·중성에서 노란색, 염기성에서 붉은색','중화 반응 탐구에서 BTB 용액으로 액성 확인','자주색 양배추 즙도 천연 지시약'],
 caution:'<b>BTB의 초록색이 중성</b>이라는 것을 꼭 기억하세요. 중화 반응 실험에서 "초록색이 되는 지점"이 곧 <b>완전히 중화된 지점</b>이고, 그때 온도가 가장 높습니다.',
 quiz:[{q:'BTB 용액을 넣었더니 초록색이 되었습니다. 이 용액의 액성은?',
   c:['중성','산성','염기성','알 수 없음'],a:0,
   why:'BTB 용액은 산성에서 노란색, 중성에서 초록색, 염기성에서 파란색을 띱니다.'}],
 rel:['산','염기','중화 반응']},

{unit:'I-2', name:'중화 반응', alias:['중화','neutralization'],
 one:'산과 염기가 반응하여 물이 생성되는 반응.',
 body:['산과 염기를 섞으면 <b>수소 이온(H⁺)과 수산화 이온(OH⁻)이 반응해 물이 생성</b>됩니다. 이것이 <b>중화 반응</b>이에요.',
  '중화 반응에서 H⁺과 OH⁻는 <b>1 : 1의 개수비</b>로 반응해 물을 만듭니다. 이 비율이 모든 계산의 핵심입니다.',
  '따라서 혼합 용액의 액성은 이렇게 결정됩니다.',
  '· H⁺ 수 = OH⁻ 수 → 완전히 중화 → <b>중성</b>',
  '· H⁺ 수가 더 많음 → H⁺이 남음 → <b>산성</b>',
  '· OH⁻ 수가 더 많음 → OH⁻가 남음 → <b>염기성</b>',
  '이때 구경꾼 이온(Na⁺, Cl⁻ 등)은 반응에 참여하지 않고 그대로 남아 있습니다.'],
 analogy:'H⁺과 OH⁻는 <b>짝이 정해진 2인 1조</b>입니다. 한 명씩 손을 잡고 물이 되어 빠져나가고, 짝이 없어 남은 쪽의 성질이 그 용액의 액성이 돼요.',
 formula:['H⁺ + OH⁻ → H₂O<span class="sm">수소 이온과 수산화 이온은 1 : 1로 반응합니다</span>',
  'HCl + NaOH → NaCl + H₂O<span class="sm">Na⁺과 Cl⁻는 반응하지 않고 남습니다</span>'],
 sim:'neutral',
 examples:['묽은 염산 + 수산화 나트륨 수용액','제산제로 위산 중화','석회 가루로 산성화된 토양 중화'],
 caution:'"산과 염기를 섞으면 무조건 중성이 된다"는 것은 <b>틀립니다</b>. 넣은 H⁺과 OH⁻의 <b>개수가 같을 때만</b> 중성이 되고, 그렇지 않으면 남은 이온에 따라 산성이나 염기성이 됩니다.',
 quiz:[{q:'농도가 같은 묽은 염산 7 mL와 수산화 나트륨 수용액 3 mL를 섞었습니다. 혼합 용액의 액성은?',
   c:['산성 (H⁺ 4개분이 남음)','중성','염기성','알 수 없음'],a:0,
   why:'H⁺ 7, OH⁻ 3이 1:1로 반응해 3쌍이 물이 되고 H⁺ 4가 남으므로 산성입니다.'}],
 rel:['산','염기','중화열','중화 반응의 이용','지시약','물질 변화와 에너지의 출입']},

{unit:'I-2', name:'중화열', alias:['중화 반응의 열'],
 one:'중화 반응이 일어날 때 발생하는 열.',
 body:['산과 염기를 섞으면 혼합 용액의 <b>온도가 높아집니다</b>. 중화 반응이 일어날 때 열이 발생하기 때문이에요. 이 열을 <b>중화열</b>이라고 합니다.',
  '중요한 규칙 : <b>반응한 수소 이온과 수산화 이온의 수가 많을수록 중화열이 많이 발생</b>해 혼합 용액의 온도가 더 높아집니다.',
  '그래서 농도와 온도가 같은 산·염기를 총 부피가 일정하게 섞을 때, <b>완전히 중화되는 지점(중성)에서 온도가 가장 높습니다</b>.',
  '즉 온도가 가장 높은 지점 = 반응한 이온이 가장 많은 지점 = <b>중성이 되는 지점</b>이에요.'],
 analogy:'중화열은 <b>악수한 횟수만큼 나는 열</b>입니다. H⁺과 OH⁻가 많이 만나 악수(반응)할수록 더 뜨거워지고, 짝이 남아돌면 악수 횟수가 줄어 덜 뜨거워요.',
 sim:'heatcurve',
 examples:['묽은 염산 5 mL + 수산화 나트륨 수용액 5 mL를 섞으면 온도가 가장 높음(교과서 탐구)','BTB 용액이 초록색이 되는 지점에서 온도가 최고'],
 caution:'온도 그래프에서 <b>꼭짓점(최고 온도)이 중성 지점</b>입니다. 그래프의 최고점을 찾으면 어느 비율에서 완전히 중화되는지 알 수 있어요.',
 quiz:[{q:'중화 반응에서 혼합 용액의 온도가 가장 높은 지점은?',
   c:['H⁺과 OH⁻가 모두 반응해 완전히 중화된 지점','산을 가장 많이 넣은 지점','염기를 가장 많이 넣은 지점','산만 넣은 지점'],a:0,
   why:'반응한 이온의 수가 가장 많을 때 중화열이 가장 많이 발생하므로, 완전히 중화되는 중성 지점에서 온도가 가장 높습니다.'}],
 rel:['중화 반응','산','염기','물질 변화와 에너지의 출입']},

{unit:'I-2', name:'중화 반응의 이용', alias:['제산제','중성지','석회 가루','염기성 치약'],
 one:'산성인 것에는 염기성 물질을, 염기성인 것에는 산성 물질을 넣어 문제를 해결하는 것.',
 body:['우리 주변에는 중화 반응을 이용하는 사례가 아주 많습니다.',
  '· <b>염기성 치약</b> — 입속 세균이 만든 산성 물질을 중화해 충치를 예방합니다.',
  '· <b>중성지</b> — 산성을 띠는 펄프를 염기로 중화해 만든 종이. 책이 오래 보존됩니다.',
  '· <b>생선 요리에 레몬즙</b> — 비린내의 주성분인 염기성 물질을 산성인 레몬즙으로 중화합니다.',
  '· <b>제산제</b> — 산성인 위산이 많이 나와 속이 쓰릴 때 염기성 물질로 중화합니다.',
  '· <b>산성화된 토양·호수에 석회 가루</b> — 염기성인 석회 가루를 뿌려 중화합니다.',
  '· <b>공장의 산성 기체를 석회석으로 중화</b> — 배출 전에 중화해 토양·호수의 산성화를 완화합니다.',
  '· <b>묵은 김치에 제빵 소다</b> — 신맛(산성)을 염기성 물질로 줄입니다.'],
 analogy:'중화 반응의 이용은 언제나 같은 규칙입니다. <b>산성이면 염기성으로, 염기성이면 산성으로</b> — 반대되는 것을 넣어 서로 성질을 없애는 거예요.',
 sim:'neutralUse',
 examples:['속 쓰릴 때 먹는 제산제(염기성)','생선에 뿌리는 레몬즙(산성)','산성화된 호수에 뿌리는 석회 가루(염기성)','산성 기체를 석회석으로 중화 후 배출'],
 caution:'무엇이 산성이고 무엇이 염기성인지 <b>먼저 판단</b>해야 합니다. 생선 비린내는 <b>염기성</b>이라 산성인 레몬즙을 쓰고, 위산은 <b>산성</b>이라 염기성인 제산제를 씁니다. 방향이 반대예요.',
 quiz:[{q:'생선 요리에 레몬즙을 뿌리는 까닭은?',
   c:['염기성인 비린내 성분을 산성인 레몬즙으로 중화하기 위해','산성인 비린내 성분을 염기성 레몬즙으로 중화하기 위해','생선을 부드럽게 하기 위해','세균을 죽이기 위해'],a:0,
   why:'생선 비린내의 주성분은 염기성 물질이므로 산성인 레몬즙으로 중화하면 냄새가 줄어듭니다.'}],
 rel:['중화 반응','산','염기','중화열']},

{unit:'I-2', name:'물질 변화와 에너지의 출입', alias:['발열','흡열','에너지 출입','에너지 방출','에너지 흡수'],
 one:'물질 변화가 일어날 때는 주변으로 에너지를 방출하거나 주변에서 에너지를 흡수한다.',
 body:['상태 변화 같은 <b>물리 변화</b>든, 연소나 중화 같은 <b>화학 변화</b>든, 물질 변화가 일어날 때는 <b>반드시 에너지가 드나듭니다</b>.',
  '<b>에너지를 방출하면</b> 그 에너지가 주변으로 나가므로 <b>주변의 온도가 높아집니다</b>. 예 : 액화, 응고, 연소, 중화 반응.',
  '<b>에너지를 흡수하면</b> 주변에서 에너지를 빼앗으므로 <b>주변의 온도가 낮아집니다</b>. 예 : 기화, 융해, 전기 분해, 질산 암모늄과 수산화 바륨의 반응.',
  '더운 여름 소나기 전에 후덥지근한 것은 수증기가 <b>액화</b>하며 열을 방출하기 때문이고, 도로에 물을 뿌리면 시원해지는 것은 물이 <b>기화</b>하며 열을 흡수하기 때문이에요.'],
 analogy:'물질 변화는 에너지를 <b>내놓거나 빌려 갑니다</b>. 내놓으면 주변이 따뜻해지고, 빌려 가면 주변이 그만큼 차가워져요.',
 sim:'energyIO',
 examples:['방출 : 나무의 연소, 중화 반응, 수증기의 액화, 물의 응고, 철 가루의 산화',
  '흡수 : 물의 기화, 얼음의 융해, 물의 전기 분해, 질산 암모늄 + 수산화 바륨의 반응, 탄산수소 나트륨의 분해'],
 caution:'헷갈리기 쉬운 부분! <b>주변의 온도</b>를 기준으로 판단하세요. 에너지를 <b>방출</b>하면 주변 온도가 <b>올라가고</b>, <b>흡수</b>하면 주변 온도가 <b>내려갑니다</b>.',
 quiz:[{q:'질산 암모늄과 수산화 바륨을 반응시켰더니 유리 기구가 나무판에 얼어붙었습니다. 이 반응은?',
   c:['주변으로부터 열에너지를 흡수하는 반응','주변으로 열에너지를 방출하는 반응','에너지 출입이 없는 반응','물이 생성되는 중화 반응'],a:0,
   why:'주변에서 열에너지를 흡수해 주변 온도가 낮아졌기 때문에 유리 기구와 나무판 사이의 물이 얼었습니다.'}],
 rel:['에너지 출입의 이용','중화열','산화','에너지 전환']},

{unit:'I-2', name:'에너지 출입의 이용', alias:['일회용 손난로','얼음주머니','냉해 예방'],
 one:'물질 변화가 일어날 때 드나드는 에너지를 생활 속에서 유용하게 쓰는 것.',
 body:['<b>에너지를 방출하는 현상의 이용</b>',
  '· <b>일회용 손난로</b> — 철 가루가 산화되어 산화 철이 되면서 열에너지를 방출합니다.',
  '· <b>과수원의 냉해 예방</b> — 개화 시기에 물을 뿌리면, 물이 얼음으로 응고하며 열에너지를 방출해 얼어 죽는 것을 막습니다.',
  '· <b>물과 산화 칼슘의 반응</b> — 많은 열이 나서 가열 장치 없이 음식을 조리할 수 있습니다(CaO + H₂O → Ca(OH)₂).',
  '<b>에너지를 흡수하는 현상의 이용</b>',
  '· <b>신선식품 배달용 얼음주머니</b> — 얼음이 물로 융해하며 열에너지를 흡수해 시원하게 유지합니다.',
  '· <b>제빵 소다로 빵 부풀리기</b> — 탄산수소 나트륨이 열에너지를 흡수해 분해되며 이산화 탄소가 발생합니다.',
  '· <b>냉감 기능성 의류</b> — 냉감 물질이 땀과 만나 열에너지를 흡수해 체온을 낮춥니다.',
  '이런 현상은 생명 현상과 지구 현상에서도 중요합니다. <b>세포호흡</b>은 열에너지를 방출하고, <b>광합성</b>은 빛에너지를 흡수하며, <b>태풍</b>은 수증기가 물로 응결하며 방출하는 열로 발달합니다.'],
 analogy:'손난로는 <b>철이 녹스는 반응을 아주 빠르게 일으켜 열을 얻는 장치</b>입니다. 오래 걸릴 반응을 짧은 시간에 일으켜 그 열을 쓰는 거예요.',
 sim:'energyUse',
 examples:['일회용 손난로(방출)','얼음주머니(흡수)','냉해 예방용 물 뿌리기(방출)','물+산화 칼슘 발열 도시락(방출)','세포호흡(방출), 광합성(흡수), 태풍의 발달(방출)'],
 caution:'일회용 손난로는 "철이 타는 것"이 아니라 <b>철이 산화되는 반응</b>입니다. 그리고 얼음주머니는 "차가움을 주는 것"이 아니라 <b>주변의 열을 흡수하는 것</b>이에요.',
 quiz:[{q:'신선식품을 배달할 때 얼음주머니를 넣는 원리는?',
   c:['얼음이 물로 융해하면서 열에너지를 흡수하기 때문','얼음이 열에너지를 방출하기 때문','얼음이 산화되기 때문','얼음이 중화 반응을 하기 때문'],a:0,
   why:'융해는 에너지를 흡수하는 변화이므로 주변의 열을 빼앗아 온도를 낮게 유지합니다.'}],
 rel:['물질 변화와 에너지의 출입','산화','광합성','에너지 전환']},

/* ================= Ⅱ-1 ================= */
{unit:'II-1', name:'생태계', alias:['ecosystem'],
 one:'생물과 환경이 서로 영향을 주고받으며 살아가는 하나의 체계.',
 body:['일정한 지역에 같은 종의 개체들이 무리를 이룬 것이 <b>개체군</b>, 여러 개체군이 같은 서식지에 모여 사는 것이 <b>군집</b>입니다.',
  '군집을 이루는 개체군들이 <b>다른 개체군 및 환경과 영향을 주고받으며 살아가는 체계</b>를 <b>생태계</b>라고 합니다.',
  '즉 <b>개체 → 개체군 → 군집 → 생태계</b> 순서로 커집니다.',
  '생태계는 <b>생물요소</b>(생산자·소비자·분해자)와 <b>비생물요소</b>(빛·온도·물·토양·공기)로 구성되며, 이들 사이의 <b>상호 관계</b>로 유지됩니다.',
  '예를 들어 숲에 빛이 잘 들고 토양에 양분이 많으면 식물이 잘 자라고(비생물 → 생물), 낙엽이 쌓여 분해되면 토양이 비옥해집니다(생물 → 비생물).'],
 analogy:'생태계는 <b>학교</b>와 비슷합니다. 학생 한 명(개체), 같은 반 학생들(개체군), 전교생(군집), 그리고 교실·운동장·날씨까지 포함한 학교 전체(생태계)입니다.',
 sim:'ecosystem',
 examples:['숲 생태계, 갯벌 생태계, 하천 생태계','도시 공원도 하나의 생태계'],
 caution:'<b>군집과 생태계의 차이</b>가 시험에 자주 나옵니다. 군집은 <b>생물끼리만</b>, 생태계는 <b>생물 + 비생물요소</b>까지 포함합니다.',
 quiz:[{q:'생태계의 구성 단계로 옳은 것은?',
   c:['개체 → 개체군 → 군집 → 생태계','개체 → 군집 → 개체군 → 생태계','군집 → 개체군 → 개체 → 생태계','개체군 → 개체 → 생태계 → 군집'],a:0,
   why:'같은 종의 개체가 모여 개체군, 여러 개체군이 모여 군집, 군집과 비생물요소가 함께 생태계를 이룹니다.'}],
 rel:['개체군과 군집','생물요소와 비생물요소','생산자·소비자·분해자','생태계평형','생태계다양성']},

{unit:'II-1', name:'개체군과 군집', alias:['개체','개체군','군집','population','community'],
 one:'개체군은 같은 종의 무리, 군집은 여러 개체군이 함께 사는 것.',
 body:['<b>개체</b> — 생물 하나하나를 말합니다.',
  '<b>개체군</b> — 일정한 지역에 사는 <b>같은 종</b>의 개체들이 이룬 무리입니다. 예) 지리산의 반달가슴곰 개체군',
  '<b>군집</b> — 같은 서식지에 모여 사는 <b>여러 개체군</b>이 모인 것입니다. 예) 지리산의 모든 생물',
  '군집을 구성하는 개체군들은 서로 <b>먹이 관계</b>로 얽혀 있어, 한 개체군의 개체수가 변하면 다른 개체군의 개체수도 영향을 받습니다.'],
 analogy:'개체 = 나 한 사람, 개체군 = 우리 반, 군집 = 전교생. 여기에 교실과 날씨까지 더하면 생태계가 됩니다.',
 sim:'ecolevel',
 examples:['숲의 소나무 개체군, 노루 개체군, 토끼 개체군','이들이 함께 사는 숲의 모든 생물 = 군집'],
 caution:'개체군은 반드시 <b>같은 종</b>이어야 합니다. "노루와 토끼가 함께 있는 무리"는 개체군이 아니라 군집의 일부예요.',
 quiz:[{q:'"지리산에 사는 모든 반달가슴곰"은 무엇에 해당할까요?',
   c:['개체군','개체','군집','생태계'],a:0,
   why:'일정한 지역에 사는 같은 종의 개체 무리는 개체군입니다.'}],
 rel:['생태계','생태계평형','생산자·소비자·분해자']},

{unit:'II-1', name:'생물요소와 비생물요소', alias:['생물요소','비생물요소','환경요인'],
 one:'생태계를 이루는 두 축. 생물요소는 모든 생물, 비생물요소는 빛·온도·물·토양·공기.',
 body:['<b>생물요소</b>는 생태계에 존재하는 <b>모든 생물</b>을 말하며, 양분을 얻는 방식에 따라 <b>생산자·소비자·분해자</b>로 나뉩니다.',
  '<b>비생물요소</b>는 생물을 둘러싸고 있는 환경요인으로, <b>빛·온도·물·토양·공기</b> 등입니다.',
  '둘은 <b>서로</b> 영향을 줍니다. 비생물요소가 생물에게 영향을 주기도 하고(빛이 강하면 잎이 두꺼워짐), 생물이 비생물요소를 바꾸기도 합니다(낙엽이 분해되어 토양이 비옥해짐).',
  '이런 <b>상호 관계</b> 덕분에 생태계가 유지됩니다.'],
 analogy:'생물요소는 <b>배우</b>, 비생물요소는 <b>무대와 조명</b>입니다. 무대가 배우의 연기를 바꾸기도 하고, 배우가 무대를 바꾸기도 해요.',
 sim:'bioAbio',
 examples:['생물요소 : 소나무(생산자), 고라니(소비자), 버섯(분해자)','비생물요소 : 빛, 온도, 물, 토양, 공기'],
 caution:'낙엽이나 죽은 나무는 <b>생물이 아니므로</b> 비생물요소(토양)로 봅니다. 살아 있는 생물만 생물요소예요.',
 quiz:[{q:'비생물요소에 해당하지 않는 것은?',
   c:['버섯','빛','토양','공기'],a:0,
   why:'버섯은 죽은 생물이나 배설물을 분해하는 분해자로, 생물요소입니다.'}],
 rel:['생태계','생산자·소비자·분해자','생물과 환경의 상호 관계']},

{unit:'II-1', name:'생산자·소비자·분해자', alias:['생산자','소비자','분해자'],
 one:'생물요소를 양분을 얻는 방법에 따라 나눈 세 가지.',
 body:['<b>생산자</b> — <b>광합성</b>으로 생명활동에 필요한 양분을 <b>스스로 만드는</b> 생물. 식물, 식물 플랑크톤 등.',
  '<b>소비자</b> — 다른 생물을 <b>먹이로 하여</b> 양분을 얻는 생물. 고라니, 멧돼지 등.',
  '<b>분해자</b> — 다른 생물의 <b>배설물이나 죽은 생물을 분해</b>하여 양분을 얻는 생물. 버섯, 세균, 곰팡이 등.',
  '분해자는 눈에 잘 띄지 않지만 아주 중요합니다. 분해자가 없으면 죽은 생물과 배설물이 쌓이기만 하고, 그 속의 물질이 <b>다시 순환하지 못합니다</b>.'],
 analogy:'생산자는 <b>요리사</b>, 소비자는 <b>손님</b>, 분해자는 <b>설거지 담당</b>입니다. 설거지가 되어야 그릇(물질)을 다시 쓸 수 있어요.',
 sim:'matterCycle',
 examples:['생산자 : 나무, 풀, 식물 플랑크톤','소비자 : 메뚜기(1차), 참새(2차), 수리부엉이(3차)','분해자 : 버섯, 세균, 곰팡이'],
 caution:'식물 플랑크톤은 크기가 작아 소비자처럼 보이지만 <b>광합성을 하므로 생산자</b>입니다. 반대로 버섯은 식물처럼 보이지만 광합성을 하지 않아 <b>분해자</b>예요.',
 quiz:[{q:'분해자에 해당하는 생물끼리 짝지어진 것은?',
   c:['버섯 – 세균 – 곰팡이','소나무 – 풀 – 식물 플랑크톤','고라니 – 멧돼지 – 참새','늑대 – 수리부엉이 – 족제비'],a:0,
   why:'분해자는 죽은 생물이나 배설물을 분해해 양분을 얻는 생물입니다.'}],
 rel:['생태계','생물요소와 비생물요소','먹이사슬','영양단계']},

{unit:'II-1', name:'생물과 환경의 상호 관계', alias:['빛','온도','물','토양','공기','일조 시간','키틴질','적응'],
 one:'생물은 빛·온도·물·토양·공기 등 환경요인의 영향을 받아 환경에 적응하며 살아간다.',
 body:['<b>빛</b> — 광합성의 에너지원입니다. 빛이 강한 곳의 잎은 <b>두껍고</b>(울타리조직 발달), 약한 곳의 잎은 <b>얇고 넓습니다</b>. 또 <b>일조 시간</b>은 동물의 번식에 영향을 줍니다. 꾀꼬리·종달새는 일조 시간이 길어지는 봄에, 송어·노루는 짧아지는 가을에 번식해요.',
  '<b>온도</b> — 물질대사에 영향을 줍니다. 추운 지방 동물은 털·깃털이 발달하고 피하 지방층이 두껍습니다. 여우는 기온이 낮은 지역일수록 <b>몸집이 크고 말단부(귀)가 작습니다</b>(북극여우 ↔ 사막여우). 툰드라의 털송이풀은 잎·꽃에 털이 나 있어요.',
  '<b>물</b> — 생물을 구성하는 성분 중 가장 많습니다. 곤충의 몸 표면은 <b>키틴질</b>, 새의 알은 단단한 껍질, 사막 도마뱀·뱀은 비늘로 수분 손실을 막습니다. 선인장은 잎이 <b>가시</b>로 변했고, 연꽃은 <b>통기조직</b>이 발달했습니다.',
  '<b>토양</b> — 수많은 생물의 서식지입니다. 지렁이·두더지는 토양에 공기가 통하게 하고, 토양 속 미생물은 물질을 순환시킵니다.',
  '<b>공기</b> — 대부분의 생물이 산소로 호흡합니다. 고산지대 사람은 <b>적혈구 수가 많아</b> 산소를 효율적으로 운반합니다.'],
 analogy:'생물의 몸은 <b>사는 곳에 맞춰 만든 맞춤옷</b>입니다. 추운 곳에 사는 여우는 열을 아끼려고 귀가 작고, 더운 곳 여우는 열을 내보내려고 귀가 커요.',
 sim:'ecofactor',
 examples:['북극여우(귀 작음) ↔ 사막여우(귀 큼)','선인장의 가시와 굵은 줄기','연꽃의 통기조직','고산지대 사람의 많은 적혈구','일조 시간에 따른 번식 시기'],
 caution:'여우의 귀 크기는 <b>온도</b>와 관련이 있고, 잎의 두께는 <b>빛</b>과 관련이 있으며, 선인장의 가시는 <b>물</b>과 관련이 있습니다. 어떤 환경요인과 연결되는지를 정확히 구분하세요.',
 quiz:[{q:'선인장의 잎이 가시로 변한 것과 가장 관련이 깊은 환경요인은?',
   c:['물','빛','온도','토양'],a:0,
   why:'잎이 가시로 변한 것은 수분의 증발을 막기 위한 적응이므로 물과 관련이 깊습니다.'}],
 rel:['생태계','생물요소와 비생물요소','광합성']},

{unit:'II-1', name:'먹이사슬', alias:['food chain'],
 one:'생산자부터 최종 소비자까지 먹고 먹히는 관계를 사슬 모양으로 나타낸 것.',
 body:['생태계의 생물들은 <b>먹이 관계</b>로 연결되어 있습니다. 매가 뱀을 먹고, 뱀이 토끼를 먹는 식이죠.',
  '이처럼 <b>생산자부터 최종 소비자까지 먹고 먹히는 관계를 사슬 모양으로 나타낸 것</b>이 <b>먹이사슬</b>입니다.',
  '먹이사슬을 화살표로 나타낼 때는 <b>먹히는 쪽 → 먹는 쪽</b>, 즉 <b>에너지가 이동하는 방향</b>으로 그립니다.',
  '실제 생태계에서는 한 생물이 여러 먹이를 먹기 때문에 먹이사슬이 여러 개 얽혀 <b>먹이그물</b>이 됩니다.'],
 analogy:'먹이사슬은 <b>한 줄로 이어진 도미노</b>입니다. 아래쪽 하나가 쓰러지면 위쪽 전체가 영향을 받아요.',
 sim:'foodchain',
 examples:['식물 → 메뚜기 → 개구리 → 뱀 → 매','식물 플랑크톤 → 크릴 → 정어리 → 상어'],
 caution:'화살표 방향에 주의하세요! "먹는 쪽 → 먹히는 쪽"이 아니라 <b>먹히는 쪽 → 먹는 쪽</b>입니다. 에너지가 흘러가는 방향으로 그리기 때문이에요.',
 quiz:[{q:'먹이사슬을 화살표로 나타낼 때 올바른 방향은?',
   c:['먹히는 생물 → 먹는 생물 (에너지 이동 방향)','먹는 생물 → 먹히는 생물','아무 방향이나 상관없다','생산자 ← 소비자'],a:0,
   why:'화살표는 에너지가 이동하는 방향, 즉 먹히는 쪽에서 먹는 쪽으로 그립니다.'}],
 rel:['먹이그물','영양단계','생태피라미드','생태계평형']},

{unit:'II-1', name:'먹이그물', alias:['food web'],
 one:'여러 개의 먹이사슬이 서로 얽혀 그물처럼 복잡하게 나타나는 것.',
 body:['실제 생태계에서 한 생물은 여러 종류의 먹이를 먹고, 또 여러 포식자에게 먹힙니다.',
  '그래서 <b>여러 개의 먹이사슬이 서로 얽혀 그물처럼 복잡하게 나타나는데</b>, 이를 <b>먹이그물</b>이라고 합니다.',
  '먹이그물이 <b>복잡할수록 생태계평형이 잘 유지</b>됩니다. 한 종이 사라져도 다른 먹이로 대체할 수 있기 때문이에요.',
  '반대로 먹이 관계가 단순하면, 한 종의 변화가 곧바로 전체에 큰 영향을 줍니다.'],
 analogy:'먹이사슬이 한 줄 밧줄이라면, 먹이그물은 <b>여러 겹으로 짠 그물</b>입니다. 한 가닥이 끊어져도 그물 전체는 버틸 수 있어요.',
 sim:'foodweb',
 examples:['숲 : 나무·풀 → 메뚜기·들쥐·다람쥐 → 참새·족제비 → 수리부엉이 → 늑대','들쥐가 사라지면 족제비가 메뚜기를 더 많이 먹게 됨'],
 caution:'생태계평형이 잘 유지되는 조건은 "생물 수가 많은 것"이 아니라 <b>먹이 관계가 복잡한 것</b>입니다.',
 quiz:[{q:'생태계평형이 가장 잘 유지되는 경우는?',

   why:'먹이 관계가 복잡할수록 한 종이 사라져도 다른 종이 대신할 수 있어 평형이 잘 유지됩니다.'}],

{unit:'II-1', name:'영양단계', alias:['trophic level','생체량'],
 one:'생물 개체군이 먹이사슬에서 차지하는 위치. 생산자·1차 소비자·2차 소비자·3차 소비자.',
 body:['<b>영양단계</b>는 생물 개체군이 먹이사슬에서 차지하고 있는 위치입니다. <b>생산자 → 1차 소비자 → 2차 소비자 → 3차 소비자</b>의 각 단계를 말해요.',
  '생태계에서 에너지는 먹이사슬을 따라 <b>하위 영양단계에서 상위 영양단계로</b> 이동합니다.',
  '이때 하위 영양단계 생물이 가진 에너지의 일부는 <b>생명활동에 쓰이거나 열에너지로 방출</b>되고, 나머지 일부만 위로 전달됩니다.',
  '그래서 <b>상위 영양단계로 갈수록 전달되는 에너지양은 크게 줄어듭니다</b>. 개체수와 <b>생체량</b>(일정한 공간에 서식하는 생물 전체의 무게)도 대체로 줄어들어요.'],
 analogy:'용돈을 형에게 주면서 조금씩 떼어 쓰는 것과 같습니다. 단계를 거칠수록 <b>남는 돈(에너지)이 확 줄어들어요</b>.',
 sim:'trophicLevel',
 examples:['생산자 : 나무, 풀','1차 소비자 : 메뚜기, 들쥐, 다람쥐','2차 소비자 : 참새, 족제비','3차 소비자 : 수리부엉이, 늑대'],
 caution:'같은 생물이라도 <b>먹이그물 안에서 위치에 따라 영양단계가 달라질 수 있습니다</b>. 예를 들어 족제비는 메뚜기를 먹으면 2차 소비자, 참새를 먹으면 3차 소비자가 됩니다.',
 quiz:[{q:'상위 영양단계로 갈수록 에너지양이 줄어드는 까닭은?',
   c:['에너지 일부가 생명활동에 쓰이거나 열에너지로 방출되기 때문','생물의 크기가 커지기 때문','개체수가 늘어나기 때문','분해자가 에너지를 가져가기 때문'],a:0,
   why:'하위 영양단계 생물이 가진 에너지 중 일부만 상위 영양단계로 전달됩니다.'}],
 rel:['생태피라미드','먹이사슬','생산자·소비자·분해자']},

{unit:'II-1', name:'생태피라미드', alias:['ecological pyramid'],
 one:'에너지양·개체수·생체량을 아래에서 위로 쌓아 올리면 위로 갈수록 줄어드는 피라미드 모양이 되는 것.',
 body:['각 영양단계의 <b>에너지양, 개체수, 생체량</b>의 상대적인 양을 하위 영양단계에서 상위 영양단계로 순서대로 쌓아 올려 봅시다.',
  '그러면 <b>위로 갈수록 줄어드는 피라미드 형태</b>가 되는데, 이를 <b>생태피라미드</b>라고 합니다.',
  '이렇게 되는 이유는 에너지가 위로 전달될 때마다 상당량이 생명활동에 쓰이거나 열로 빠져나가기 때문입니다.',
  '안정된 생태계에서는 생태피라미드가 <b>아래가 넓고 위가 좁은</b> 안정된 모양을 유지합니다.'],
 analogy:'생태피라미드는 <b>사람 탑</b>과 같습니다. 아래에 사람이 많아야 위에 올라설 수 있듯이, 생산자가 많아야 상위 소비자가 살 수 있어요.',
 sim:'pyramid',
 examples:['육상 생태계 : 식물 → 곤충·달팽이 → 비둘기·오리 → 매','해양 생태계 : 식물 플랑크톤 → 크릴·동물 플랑크톤 → 정어리·연어 → 상어'],
 caution:'"위로 갈수록 <b>덩치는 커지지만 수는 적어진다</b>"고 생각하면 이해가 쉽습니다. 에너지양·개체수·생체량 <b>세 가지 모두</b> 위로 갈수록 줄어드는 경향이 있어요.',
 quiz:[{q:'생태피라미드가 위로 갈수록 좁아지는 까닭으로 옳은 것은?',
   c:['상위 영양단계로 갈수록 전달되는 에너지양이 줄어들기 때문','상위 소비자의 몸집이 크기 때문','생산자가 너무 많기 때문','분해자가 없기 때문'],a:0,
   why:'에너지가 위로 전달될 때마다 일부만 전달되므로 에너지양·개체수·생체량이 모두 줄어듭니다.'}],
 rel:['영양단계','먹이사슬','생태계평형']},

{unit:'II-1', name:'생태계평형', alias:['생태계 평형','포식과 피식','ecological balance'],
 one:'생물군집의 구성·개체수·물질의 양·에너지 흐름이 균형을 이루면서 안정된 상태를 유지하는 것.',
 body:['생태계에서 <b>생물군집의 구성이나 개체수, 물질의 양, 에너지의 흐름이 균형을 이루면서 안정된 상태를 유지하는 것</b>을 <b>생태계평형</b>이라고 합니다.',
  '생태계평형은 주로 생물들 사이의 <b>먹고 먹히는 관계</b>로 유지되며, 먹이 관계가 <b>복잡할수록</b> 잘 유지됩니다.',
  '<b>포식과 피식</b>의 관계도 개체수를 조절합니다. 피식자가 늘면 → 포식자가 늘고 → 피식자가 줄고 → 먹이가 부족해 포식자도 줍니다. 이렇게 <b>주기적으로 변동</b>해요.',
  '안정된 생태계는 일시적으로 환경이 변해도 <b>스스로 평형을 회복</b>합니다. 1차 소비자가 갑자기 늘면 → 생산자가 줄고 2차 소비자가 늘어 → 1차 소비자가 줄고 → 생산자가 회복되어 다시 평형을 이룹니다.'],
 analogy:'생태계평형은 <b>흔들리는 시소가 스스로 균형을 되찾는 것</b>과 같습니다. 살짝 밀면 흔들리다가 다시 제자리로 오지만, 너무 세게 밀면 아예 넘어져 버려요.',
 sim:['balance','predprey'],
 examples:['스라소니(포식자)와 눈신토끼(피식자)의 개체수 주기적 변동','늑대가 사라진 지역에서 초식동물이 폭증해 숲이 훼손된 사례'],
 caution:'생태계평형은 "개체수가 항상 똑같이 유지되는 것"이 아니라 <b>일정한 범위 안에서 오르내리며 균형을 유지하는 것</b>입니다. 또 <b>과도한 환경 변화가 일어나면 회복하지 못하고 파괴</b>될 수 있어요.',
 quiz:[{q:'1차 소비자의 개체수가 일시적으로 증가했을 때, 안정된 생태계에서 일어나는 변화 순서로 옳은 것은?',
   c:['생산자 감소·2차 소비자 증가 → 1차 소비자 감소 → 평형 회복','생산자 증가 → 1차 소비자 계속 증가 → 생태계 파괴','2차 소비자 감소 → 1차 소비자 증가 → 평형 회복','아무 변화도 일어나지 않는다'],a:0,
   why:'1차 소비자가 늘면 생산자는 줄고 2차 소비자는 늘어납니다. 그러면 1차 소비자가 줄고 생산자가 회복되어 다시 평형을 이룹니다.'}],
 rel:['먹이그물','먹이사슬','생태피라미드','생태계보전','종다양성']},

{unit:'II-1', name:'생태계보전', alias:['생태계 보전','천연기념물','국립 공원','환경영향평가'],
 one:'환경 변화로부터 생태계를 지키기 위한 여러 가지 노력.',
 body:['생태계는 지진·화산·태풍·홍수 같은 <b>자연재해</b>와 인위적인 개발·무분별한 벌목·환경 오염 같은 <b>인간 활동</b>의 영향을 받습니다.',
  '환경 변화는 서식지를 훼손하고 먹이 관계를 파괴해 <b>생태계평형을 깨뜨릴 수 있습니다</b>. 생태계가 파괴되면 인간을 포함한 모든 생물의 생존이 위협받고, 회복에는 오랜 시간과 많은 노력이 듭니다.',
  '우리나라의 보전 노력 : 보호할 생물·서식지를 <b>천연기념물</b>로 지정, 보전 가치가 있는 생태계를 <b>국립 공원·보호 구역</b>으로 지정, 자연환경 보전을 위한 <b>특별법</b> 제정 및 시행, 개발 전 <b>환경영향평가</b> 실시.',
  '국제 사회도 법 제정과 국제 협약 체결 등으로 노력하고 있습니다.'],
 analogy:'생태계는 한 번 무너지면 <b>다시 쌓기가 훨씬 어려운 탑</b>입니다. 그래서 무너진 뒤 고치는 것보다 <b>미리 지키는 것</b>이 훨씬 중요해요.',
 sim:'ecoProtect',
 examples:['천연기념물 : 반달가슴곰','국립 공원 : 지리산','환경영향평가 : 개발 사업 전 생태계 영향 분석','유엔 생태계복원 10개년 계획'],
 caution:'생태계는 <b>일시적인</b> 변화는 스스로 회복하지만, <b>과도한</b> 변화는 회복하지 못합니다. 회복력에는 한계가 있다는 점이 중요해요.',
 quiz:[{q:'생태계보전을 위한 노력으로 보기 어려운 것은?',
   c:['무분별한 벌목으로 목재를 확보한다','보전 가치가 있는 생태계를 국립 공원으로 지정한다','개발 전 환경영향평가를 실시한다','보호할 생물을 천연기념물로 지정한다'],a:0,
   why:'무분별한 벌목은 생태계에 영향을 주는 인간 활동으로, 생태계 파괴의 원인입니다.'}],
 rel:['생태계평형','생물다양성 보전','기후 변화']},

{unit:'II-1', name:'복사 평형', alias:['지구 열수지','radiative equilibrium'],
 one:'지구가 태양에서 흡수한 에너지와 같은 양의 에너지를 우주로 방출해 균형을 이루는 것.',
 body:['지구는 태양으로부터 흡수한 에너지와 <b>같은 양</b>의 에너지를 우주로 방출하면서 에너지 평형을 이루고 있습니다. 이를 <b>복사 평형</b>이라고 해요.',
  '복사 평형 상태에서 나타나는 <b>지표·대기·우주 사이의 열 출입 관계</b>를 <b>지구 열수지</b>라고 합니다.',
  '지구에 들어오는 태양 복사 에너지량을 <b>100</b>이라 하면, <b>30</b>은 반사·산란되어 우주로 되돌아가고, <b>70</b>이 지표면(47)과 대기(23)에 흡수됩니다.',
  '그리고 흡수한 것과 같은 양인 <b>70</b>을 지구 복사 에너지로 우주에 방출해 평형을 이룹니다.',
  '복사 평형 덕분에 지구의 평균 온도가 <b>일정하게 유지</b>됩니다.'],
 analogy:'복사 평형은 <b>들어오는 물과 빠져나가는 물이 같아 수위가 일정한 욕조</b>입니다. 배수구를 좁히면(온실 기체 증가) 물이 차오르듯 지구가 더워져요.',
 formula:['흡수 (47 + 23 = 70) = 방출 (12 + 58 = 70)<span class="sm">태양 복사 100 = 반사 30 + 흡수 70</span>'],
 sim:'heatbudget',
 examples:['지구의 평균 온도가 일정하게 유지되는 까닭','온실 기체가 늘면 더 높은 온도에서 새로운 복사 평형이 이루어짐'],
 caution:'복사 평형은 "에너지가 드나들지 않는 상태"가 아니라 <b>들어오는 양과 나가는 양이 같은 상태</b>입니다. 에너지는 계속 드나들고 있어요.',
 quiz:[{q:'지구에 들어오는 태양 복사 에너지를 100이라 할 때, 지구가 우주로 방출하는 지구 복사 에너지의 양은?',
   c:['70','100','30','47'],a:0,
   why:'100 중 30은 반사·산란되고 70이 흡수되므로, 평형을 이루려면 같은 양인 70을 방출해야 합니다.'}],
 rel:['온실 효과','지구 온난화','온실 기체']},

{unit:'II-1', name:'온실 효과', alias:['greenhouse effect'],
 one:'대기 중 온실 기체가 지구 복사 에너지를 흡수했다가 지표로 다시 보내 지구를 따뜻하게 하는 현상.',
 body:['지구 대기에는 <b>이산화 탄소, 메테인, 산화 이질소</b> 등 <b>온실 기체</b>가 들어 있습니다.',
  '온실 기체는 지표에서 방출되는 <b>지구 복사 에너지를 흡수</b>했다가 <b>지표로 다시 보냅니다(재복사)</b>. 이렇게 지구를 따뜻하게 유지하는 현상이 <b>온실 효과</b>입니다.',
  '온실 효과는 <b>나쁜 것이 아닙니다!</b> 온실 효과 덕분에 지구는 생명체가 살기에 적절한 평균 온도(약 15 ℃)를 유지해 왔어요. 온실 효과가 없었다면 지구 평균 온도는 약 −18 ℃로 아주 추웠을 것입니다.',
  '문제는 산업혁명 이후 <b>온실 기체가 너무 많이 배출되어 온실 효과가 강화된 것</b>입니다. 이것이 지구 온난화로 이어집니다.'],
 analogy:'온실 효과는 지구가 덮고 있는 <b>이불</b>입니다. 이불이 있어야 얼어 죽지 않지만, 이불을 너무 두껍게 덮으면 더워서 못 견디게 돼요.',
 sim:'greenhouse',
 examples:['이산화 탄소(배출량 약 75 %), 메테인(약 18 %), 산화 이질소(약 4 %)','온실 효과가 없으면 지구 평균 온도는 약 −18 ℃'],
 caution:'<b>온실 효과 ≠ 지구 온난화</b>입니다. 온실 효과는 원래부터 있던 자연 현상이고, 그것이 <b>강화되어</b> 평균 온도가 올라가는 것이 지구 온난화예요.',
 quiz:[{q:'온실 효과에 대한 설명으로 옳은 것은?',
   c:['원래 있던 자연 현상으로, 지구를 생명체가 살기 좋은 온도로 유지해 준다','최근에 처음 생긴 현상이다','지구를 차갑게 만드는 현상이다','오존층이 일으키는 현상이다'],a:0,
   why:'온실 효과 덕분에 지구는 적절한 평균 온도를 유지해 왔습니다. 문제는 온실 기체 증가로 이것이 강화된 것입니다.'}],
 rel:['온실 기체','지구 온난화','복사 평형','기후 변화']},

{unit:'II-1', name:'온실 기체', alias:['이산화 탄소','메테인','산화 이질소','greenhouse gas'],
 one:'지구 복사 에너지를 흡수했다가 다시 방출하여 온실 효과를 일으키는 기체.',
 body:['<b>온실 기체</b>는 지표에서 나가는 지구 복사 에너지를 흡수했다가 지표로 재복사하는 기체입니다.',
  '주요 온실 기체는 <b>이산화 탄소(CO₂), 메테인(CH₄), 산화 이질소(N₂O)</b> 등입니다.',
  '배출량으로 보면 <b>이산화 탄소가 약 75 %</b>로 가장 많고, 메테인이 약 18 %, 산화 이질소가 약 4 %입니다.',
  '산업 및 생활에서 <b>화석 연료</b>를 계속 쓰고, <b>삼림 훼손</b>과 <b>목축업</b>이 늘면서 온실 기체의 양이 계속 증가하고 있어요.',
  '게다가 온실 기체의 일부는 <b>오랜 기간 대기에 남아 있는</b> 특성이 있어, 이미 배출한 것만으로도 지구 온난화가 더 심해질 것입니다.'],
 analogy:'온실 기체는 한 번 덮으면 <b>잘 벗겨지지 않는 이불</b>입니다. 지금 당장 배출을 멈춰도 이미 덮인 이불은 한동안 그대로 남아 있어요.',
 sim:'ghgGas',
 examples:['화석 연료 연소 → 이산화 탄소','목축업(소의 트림) → 메테인','삼림 훼손 → 흡수되던 이산화 탄소가 대기에 남음'],
 caution:'수증기도 온실 기체이지만, 교과서에서 <b>인간 활동으로 늘어난 온실 기체</b>로 다루는 것은 주로 이산화 탄소·메테인·산화 이질소입니다.',
 quiz:[{q:'대기로 배출되는 양이 가장 많은 온실 기체는?',
   c:['이산화 탄소','메테인','산화 이질소','산소'],a:0,
   why:'온실 기체 중 이산화 탄소가 약 75 %로 배출량이 가장 많습니다. 산소는 온실 기체가 아닙니다.'}],
 rel:['온실 효과','지구 온난화','복사 평형','기후 변화']},

{unit:'II-1', name:'지구 온난화', alias:['global warming'],
 one:'대기 중 온실 기체의 양이 증가해 온실 효과가 강화되어 지구의 평균 온도가 높아지는 현상.',
 body:['<b>지구 온난화</b>는 대기 중 온실 기체의 양이 증가함에 따라 <b>온실 효과가 강화되어</b> 지구의 평균 온도가 높아지는 현상입니다.',
  '메커니즘을 순서대로 봅시다. ① 온실 기체 증가 → ② 지표에서 방출되는 지구 복사 에너지를 대기가 <b>더 많이 흡수</b> → ③ 더 많은 에너지가 지표로 <b>재복사</b> → ④ <b>지구 열수지 변동</b> → ⑤ <b>더 높은 온도에서</b> 복사 평형이 이루어짐 → 지구 온난화 심화.',
  '지구 온난화가 심해지면 홍수·가뭄·폭염·한파 같은 <b>극단적인 날씨</b>가 자주 나타나고, <b>물 부족, 해수면 상승, 빙하 면적 감소, 생태계 파괴, 사막화, 동식물의 서식지 변화와 멸종</b> 등이 일어납니다.',
  '따라서 인위적인 온실 기체 <b>배출량을 줄이기 위한 노력</b>이 필요합니다.'],
 analogy:'지구 온난화는 <b>이불을 한 겹 더 덮은 것</b>입니다. 몸에서 나가는 열은 그대로인데 이불이 두꺼워져, 결국 <b>더 높은 체온에서</b> 균형이 잡히는 것과 같아요.',
 sim:'warming',
 examples:['빙하 면적 감소, 해수면 상승','폭염·한파·홍수·가뭄 등 극단적 날씨 증가','생물다양성 감소, 감염병 확산','대책 : 대중교통 이용, 일회용품 줄이기, 친환경 제품 구입, 국제 협약'],
 caution:'지구 온난화의 결과를 "더워지는 것"만으로 생각하기 쉽지만, <b>한파처럼 더 추워지는 현상</b>도 함께 나타납니다. 기후가 <b>극단적으로 불안정해지는 것</b>이 핵심이에요.',
 quiz:[{q:'지구 온난화가 일어나는 메커니즘으로 옳은 것은?',
   c:['온실 기체 증가 → 온실 효과 강화 → 더 높은 온도에서 복사 평형','오존층 파괴 → 자외선 증가 → 기온 상승','태양 복사 에너지 감소 → 기온 상승','지구 자전 속도 변화 → 기온 상승'],a:0,
   why:'온실 기체가 늘면 대기가 지구 복사 에너지를 더 많이 흡수·재복사하여 더 높은 온도에서 복사 평형이 이루어집니다.'}],
 rel:['온실 효과','온실 기체','복사 평형','기후 변화','사막화']},

{unit:'II-1', name:'엘니뇨', alias:['무역풍','El Nino','엘니뇨 현상'],
 one:'무역풍이 약해져 동태평양 적도 부근의 표층 수온이 평년보다 높은 상태가 지속되는 현상.',
 body:['<b>평상시</b> 태평양 적도 부근에서는 <b>무역풍</b>(동 → 서)이 불어 동태평양의 따뜻한 표층 해수를 서쪽으로 이동시킵니다.',
  '그 결과 동태평양 해역에는 영양분이 많은 <b>심해의 찬 해수가 올라와(용승)</b> 좋은 어장이 형성됩니다. 서태평양은 따뜻한 해수 때문에 상승 기류가 발달해 비가 많고, 동태평양은 찬 해수 때문에 하강 기류가 발달해 비가 적어요.',
  '그런데 <b>무역풍이 평상시보다 약해지면</b>, 따뜻한 표층 해수의 이동이 약해져 <b>동태평양의 표층 수온이 평년보다 높은 상태가 한동안 지속</b>됩니다. 이것이 <b>엘니뇨</b>입니다.',
  '엘니뇨가 발생하면 동태평양 해역에 영양분 공급이 줄어 <b>어획량이 감소</b>하고 해양 생태계가 교란됩니다. 또 기류가 뒤바뀌어 <b>서태평양은 가뭄, 동태평양은 홍수</b>가 나타나요.',
  '엘니뇨의 영향은 전 세계로 확대되어 아시아 가뭄, 유럽 이상 고온, 호주 산불, 남미 홍수 등을 일으킵니다.'],
 analogy:'무역풍은 따뜻한 물을 서쪽으로 미는 <b>보이지 않는 손</b>입니다. 이 손의 힘이 빠지면 따뜻한 물이 동쪽에 그대로 머물러, 날씨 지도가 뒤집혀요.',
 sim:'elnino',
 examples:['동태평양 어획량 감소','서태평양(호주·동남아) 가뭄과 산불','남미 지역 홍수','산호초 백화 현상'],
 caution:'엘니뇨는 <b>무역풍이 약해져서</b> 생깁니다. 강해져서가 아니에요. 그리고 수온이 높아지는 곳은 <b>동태평양</b>입니다. 방향을 헷갈리지 마세요.',
 quiz:[{q:'엘니뇨가 발생하는 시기, 적도 부근 동태평양의 표층 수온은 평상시와 비교하면?',
   c:['높아진다','낮아진다','변화가 없다','계절에 따라 다르다'],a:0,
   why:'무역풍이 약해져 따뜻한 표층 해수가 서쪽으로 덜 이동하므로 동태평양의 표층 수온이 평년보다 높아집니다.'}],
 rel:['사막화','기후 변화','지구 온난화']},

{unit:'II-1', name:'사막화', alias:['desertification'],
 one:'사막이 아니던 지역의 토지가 황폐해지면서 점차 사막으로 변해 가는 현상.',
 body:['<b>사막화</b>는 사막이 아니던 지역의 토지가 황폐해지면서 사막으로 변해 가는 현상입니다.',
  '사막화 지역은 주로 <b>강수량이 적고 증발량이 많은 위도 30° 부근</b>의 건조한 곳에 위치합니다.',
  '원인은 두 가지가 함께 작용합니다. <b>자연적 요인</b> — 대기 대순환이 변해 증발량이 늘고 강수량이 줄어 장기간 가뭄이 지속되는 것. <b>인위적 요인</b> — 과잉 경작, 과잉 방목, 무분별한 삼림 파괴.',
  '사막화가 진행되면 <b>농경지 감소 → 작물 수확량 감소 → 식량 부족</b>, <b>하천 수량 감소 → 물 부족 심화</b>, <b>황사 증가 → 건강과 식물 생장에 나쁜 영향</b>이 나타납니다.',
  '대책으로 많은 국가가 <b>사막화 방지 협약</b>에 가입해 노력하고 있습니다.'],
 analogy:'사막화는 땅이 <b>서서히 말라 죽어 가는 것</b>입니다. 화분에 물을 주지 않고 계속 잎만 뜯어 가면 결국 흙만 남는 것과 비슷해요.',
 sim:'desert',
 examples:['사하라 사막 주변, 고비 사막 주변','과잉 방목으로 풀이 사라진 초원','황사의 발원지 확대'],
 caution:'사막화는 자연적 요인 <b>또는</b> 인위적 요인 하나 때문이 아니라, <b>둘이 복합적으로 작용</b>해 일어납니다. 특히 인위적 요인이 사막화를 <b>가속</b>시킵니다.',
 quiz:[{q:'사막화를 가속시키는 인위적 요인이 아닌 것은?',
   c:['대기 대순환의 변화','과잉 경작','과잉 방목','무분별한 삼림 파괴'],a:0,
   why:'대기 대순환의 변화는 자연적 요인입니다. 과잉 경작·과잉 방목·삼림 파괴가 인위적 요인입니다.'}],
 rel:['엘니뇨','기후 변화','지구 온난화','생물다양성 보전']},

{unit:'II-1', name:'기후 변화', alias:['climate change','지구 환경 변화'],
 one:'지구 온난화 등으로 기후가 장기간에 걸쳐 변하는 것. 생태계와 인류의 삶에 큰 위협이 된다.',
 body:['지속되는 지구 온난화로 나타나는 <b>기후 변화</b>는 생태계를 포함한 지구 환경 전체에 영향을 주어 결국 인류의 삶에 큰 위협이 됩니다.',
  '<b>영향</b> : 해수면 상승, 생물다양성 감소, 물 부족, 식량난, 기상 재해 증가, 감염병 확산 등.',
  '<b>대책</b> : 온실 기체 배출량 줄이기, 국제 협약을 통한 지구 환경 변화 방지 등.',
  '일상생활에서 실천할 수 있는 것도 많습니다. <b>대중교통 이용하기, 일회용품 사용하지 않기, 친환경 제품 구입하기</b> 등이에요.'],
 analogy:'날씨가 "오늘의 기분"이라면 기후는 "그 사람의 성격"입니다. 기후 변화는 <b>지구의 성격 자체가 달라지는 것</b>이라 되돌리기가 훨씬 어려워요.',
 sim:'climate',
 examples:['해수면 상승으로 잠기는 섬','물 부족과 식량난','폭염·홍수 등 기상 재해 증가','감염병 매개 모기의 서식지 확대'],
 caution:'<b>날씨</b>는 짧은 기간의 대기 상태이고, <b>기후</b>는 오랜 기간의 평균적인 상태입니다. "올겨울이 추웠으니 지구 온난화는 거짓말"이라는 말은 이 둘을 혼동한 것이에요.',
 quiz:[{q:'기후 변화에 대처하기 위한 일상생활의 실천으로 알맞지 않은 것은?',
   c:['일회용품을 더 많이 사용한다','대중교통을 이용한다','친환경 제품을 구입한다','에너지 효율이 높은 제품을 쓴다'],a:0,
   why:'일회용품 사용은 온실 기체 배출을 늘립니다. 사용을 줄여야 합니다.'}],
 rel:['지구 온난화','온실 기체','사막화','엘니뇨','생물다양성 보전','신재생 에너지']}
);

TERMS.push(
{unit:'I-2', name:'광합성', alias:['photosynthesis','세포호흡'],
 one:'식물이 빛에너지를 흡수해 이산화 탄소와 물로 포도당과 산소를 만드는 작용.',
 body:['<b>광합성</b>은 식물이 빛에너지를 이용하여 양분을 합성하는 작용입니다. 이산화 탄소와 물이 반응해 <b>포도당과 산소</b>를 만들어요.',
  '광합성은 <b>산화·환원 반응</b>입니다. 이산화 탄소는 산소를 잃어 포도당이 되므로 <b>환원</b>되고, 물은 산소 기체가 되는 쪽이므로 <b>산화</b>됩니다.',
  '광합성은 빛에너지를 <b>흡수</b>하는 반응입니다(흡열). 흡수한 빛에너지가 포도당의 <b>화학 에너지</b>로 저장되지요.',
  '반대로 우리 몸속에서 일어나는 <b>세포호흡</b>은 포도당을 분해해 에너지를 얻는 반응으로, <b>열에너지를 방출</b>합니다(발열).',
  '광합성은 지구 역사도 바꾸었습니다. 원시 바다에서 <b>남세균</b>이 최초로 광합성을 하면서 산소가 생겼고, 그 산소가 대기에 쌓여 산소 호흡 생물이 등장할 수 있었어요.'],
 analogy:'광합성은 <b>햇빛으로 밥을 짓는 것</b>이고, 세포호흡은 <b>그 밥을 먹고 힘을 내는 것</b>입니다. 하나는 에너지를 저장하고, 하나는 꺼내 씁니다.',
 formula:['6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂<span class="sm">이산화 탄소 : 환원 / 물 : 산화 · 빛에너지를 흡수합니다</span>'],
 sim:'photosyn',
 examples:['남세균의 광합성 → 대기 중 산소 축적','식물이 만든 포도당이 생명 현상 유지에 쓰임','생태계에서 식물이 생산자인 까닭'],
 caution:'광합성은 에너지를 <b>흡수</b>하고, 세포호흡은 에너지를 <b>방출</b>합니다. 방향이 반대라는 점을 꼭 기억하세요.',
 quiz:[{q:'광합성에 대한 설명으로 옳은 것은?',
   c:['빛에너지를 흡수하여 화학 에너지로 저장하는 산화·환원 반응이다','열에너지를 방출하는 반응이다','산소를 소비하고 이산화 탄소를 내놓는다','분해자가 하는 작용이다'],a:0,
   why:'광합성은 빛에너지를 흡수해 포도당의 화학 에너지로 저장하며, 산소가 이동하는 산화·환원 반응입니다.'}],
 rel:['산화','환원','산화·환원 반응의 이용','에너지 출입의 이용','생산자·소비자·분해자']},

/* ================= Ⅱ-2 ================= */
{unit:'II-2', name:'수소 핵융합 반응', alias:['핵융합','태양 에너지의 생성'],
 one:'태양 중심부에서 수소 원자핵이 합쳐져 헬륨 원자핵이 되면서 에너지를 내놓는 반응.',
 body:['우리가 살아가는 데 필요한 에너지의 <b>원천은 태양 에너지</b>입니다. 태양 에너지는 약 <b>1500만 K</b>의 초고온 상태인 태양의 <b>중심부</b>에서 생성됩니다.',
  '태양 중심부에서는 <b>수소 원자핵이 단계별로 충돌하여 헬륨 원자핵이 만들어지는</b> 반응이 일어납니다. 이것이 <b>수소 핵융합 반응</b>이에요.',
  '그런데 만들어진 <b>헬륨 원자핵 1개의 질량</b>은, 반응에 참여한 양성자 2개와 중성자 2개의 질량을 모두 더한 것보다 <b>작습니다</b>. 즉 반응 과정에서 질량이 줄어듭니다.',
  '1905년 아인슈타인은 <b>질량과 에너지가 서로 변환될 수 있는 물리량</b>임을 밝혀냈습니다. 이에 따르면 핵융합 과정에서 <b>감소한 질량만큼 태양 에너지가 생성</b>되는 것입니다.'],
 analogy:'수소 원자핵 네 개를 뭉쳐 헬륨을 만들면 <b>부스러기(질량)가 조금 남는데</b>, 그 부스러기가 통째로 에너지가 되어 쏟아져 나오는 것입니다.',
 sim:'fusion',
 examples:['태양이 46억 년 동안 계속 빛나는 까닭','한국형 핵융합 연구 장치(KSTAR) : 지상에서 핵융합을 구현하려는 연구'],
 caution:'<b>핵융합</b>(가벼운 원자핵이 합쳐짐, 태양)과 <b>핵분열</b>(무거운 원자핵이 쪼개짐, 핵발전소)을 구분하세요. 둘 다 질량이 줄면서 에너지가 나오지만 방향이 반대입니다.',
 quiz:[{q:'수소 핵융합 반응에서 에너지가 발생하는 까닭은?',
   c:['반응 과정에서 줄어든 질량이 에너지로 변환되기 때문','수소가 산소와 결합하기 때문','헬륨이 폭발하기 때문','태양이 회전하기 때문'],a:0,
   why:'헬륨 원자핵의 질량이 반응에 참여한 입자들의 질량 합보다 작으며, 감소한 질량만큼 에너지가 생성됩니다.'}],
 rel:['태양 에너지','핵발전','에너지 전환']},

{unit:'II-2', name:'태양 에너지', alias:['태양 에너지의 전환','에너지 흐름'],
 one:'지구 에너지의 원천. 열·운동·화학·전기 에너지 등으로 전환되며 지구의 에너지 흐름을 일으킨다.',
 body:['태양에서 생성된 에너지는 사방으로 퍼져 나가고, 그중 일부가 지구에 도달해 <b>열에너지·운동 에너지·화학 에너지·전기 에너지</b> 등 다양한 에너지로 전환됩니다.',
  '<b>물의 순환 경로</b> : 태양 에너지 → 바다에 열에너지로 흡수 → 물이 증발 → 구름 → 비·눈 → 강·댐의 <b>위치 에너지</b> → 흐르는 물의 <b>운동 에너지</b> → 수력 발전의 <b>전기 에너지</b> → 물은 다시 바다로.',
  '<b>탄소의 경로</b> : 대기 중 이산화 탄소 → 광합성으로 식물에 <b>화학 에너지</b>로 저장 → 생명체의 유해가 묻혀 <b>화석 연료</b> → 자동차·공장에서 연소하며 <b>운동 에너지·열에너지</b> → 탄소는 이산화 탄소로 대기에 배출.',
  '<b>바람의 경로</b> : 태양 에너지가 열에너지로 대기에 흡수 → 바람 발생 → 바람의 <b>운동 에너지</b>가 대기와 해수를 움직임.',
  '이처럼 태양 에너지의 전환은 <b>연속적인 과정</b>으로 이루어지며, 지구시스템의 각 권역을 이동하면서 <b>에너지 흐름</b>을 일으킵니다.'],
 analogy:'태양 에너지는 지구를 돌아다니는 <b>릴레이 배턴</b>입니다. 바다 → 구름 → 비 → 강 → 발전소로 배턴이 넘어가며 형태만 바뀔 뿐 계속 이어져요.',
 sim:'solarflow',
 examples:['바람 : 태양 에너지 → 열에너지 → 운동 에너지','태양 전지 : 빛에너지 → 전기 에너지','식물의 광합성 : 빛에너지 → 화학 에너지'],
 caution:'화석 연료의 에너지도 <b>원래는 태양 에너지</b>였습니다. 아주 오래전 식물이 광합성으로 저장한 화학 에너지가 땅속에 묻힌 것이니까요.',
 quiz:[{q:'다음 중 태양 에너지에서 유래하지 않은 에너지는?',
   c:['핵발전의 핵에너지','바람의 운동 에너지','화석 연료의 화학 에너지','수력 발전에 쓰이는 물의 위치 에너지'],a:0,
   why:'바람·화석 연료·물의 순환은 모두 태양 에너지에서 비롯되지만, 핵발전의 핵에너지는 우라늄 원자핵에서 나옵니다.'}],
 rel:['수소 핵융합 반응','에너지 전환','에너지 보존 법칙','신재생 에너지']},

{unit:'II-2', name:'전자기 유도', alias:['electromagnetic induction','패러데이'],
 one:'코일 근처에서 자석을 움직였을 때 자기장이 변하여 코일에 전류가 유도되어 흐르는 현상.',
 body:['코일 근처에서 자석을 움직이면 <b>코일을 통과하는 자기장이 시간에 따라 변합니다</b>. 그러면 코일에 전류가 흐르는데, 이 현상이 <b>전자기 유도</b>입니다.',
  '핵심은 <b>자기장의 변화</b>예요. 자석을 가만히 두면 자기장이 변하지 않으므로 <b>전류가 흐르지 않습니다</b>.',
  '이 현상은 영국의 <b>패러데이</b>가 발견했습니다. 외르스테드가 "전류가 자기장을 만든다"는 것을 발견하자, 패러데이는 반대로 "자기장으로 전류를 만들 수 있지 않을까?" 하는 의문을 품고 오랜 실험 끝에 전자기 유도를 발견했어요.',
  '전자기 유도는 오늘날 <b>모든 발전기</b>의 원리입니다. 우리가 쓰는 전기는 대부분 이 원리로 만들어져요.'],
 analogy:'전자기 유도는 <b>"변할 때만" 반응하는 센서</b>와 같습니다. 자동문이 사람이 움직일 때만 열리듯, 코일도 자기장이 <b>변할 때만</b> 전류를 만들어요.',
 sim:'induction',
 examples:['자가 발전형 손전등','교통 카드 · 무선 충전기','발전소의 발전기','인덕션 레인지'],
 caution:'자석을 코일 <b>속에 넣어 둔 채 가만히 두면</b> 전류가 흐르지 않습니다. 자석이 <b>움직이는 동안</b>에만 자기장이 변해 전류가 생겨요.',
 quiz:[{q:'코일 속에 자석을 넣고 움직이지 않게 가만히 두었습니다. 이때 코일에 흐르는 전류는?',
   c:['흐르지 않는다 (자기장이 변하지 않으므로)','계속 일정하게 흐른다','점점 세진다','방향이 계속 바뀐다'],a:0,
   why:'전자기 유도는 코일을 통과하는 자기장이 변할 때 일어납니다. 자석이 정지해 있으면 자기장이 변하지 않으므로 유도 전류가 흐르지 않습니다.'}],
 rel:['유도 전류','발전기','화력 발전','핵발전']},

{unit:'II-2', name:'유도 전류', alias:['induced current'],
 one:'전자기 유도 과정에서 코일에 흐르는 전류.',
 body:['<b>유도 전류</b>는 전자기 유도 과정에서 코일에 흐르는 전류입니다. 검류계 바늘의 움직임으로 확인할 수 있어요.',
  '<b>방향</b> — 검류계 바늘이 움직이는 <b>방향</b>으로 알 수 있습니다. 유도 전류의 방향은 ① <b>자석의 운동 방향</b>(가까이 할 때 ↔ 멀리 할 때)과 ② <b>코일에 가까이 하는 자석의 극</b>(N극 ↔ S극)에 따라 <b>반대가 됩니다</b>.',
  '<b>세기</b> — 검류계 바늘이 움직이는 <b>폭</b>으로 알 수 있습니다. 다음 세 가지일 때 세집니다.',
  '· 자석의 <b>세기가 셀수록</b> (자석을 같은 극끼리 겹쳐 움직이면 셈)',
  '· 자석을 <b>빠르게 움직일수록</b>',
  '· 코일을 <b>많이 감을수록</b>',
  '앞의 두 가지는 결국 <b>자기장의 변화가 클수록</b>이라는 하나의 이유로 설명됩니다.'],
 analogy:'유도 전류의 세기는 <b>물을 얼마나 빠르고 세게 젓느냐</b>에 달려 있습니다. 세게(자석 세기), 빠르게(속도), 큰 도구로(감은 수) 저을수록 물결이 커져요.',
 sim:'indCurrent',
 examples:['자석을 빠르게 흔들면 자가 발전형 손전등이 더 밝아짐','코일을 많이 감은 발전기가 더 많은 전기를 만듦'],
 caution:'"자석의 N극을 가까이 할 때"와 "S극을 멀리 할 때"는 유도 전류의 방향이 <b>같습니다</b>. 극과 운동 방향이 <b>둘 다 반대</b>가 되면 결과는 같아지기 때문이에요.',
 quiz:[{q:'유도 전류의 세기를 크게 하는 방법이 아닌 것은?',
   c:['자석을 코일 속에 넣고 가만히 둔다','더 센 자석을 사용한다','자석을 더 빠르게 움직인다','코일을 더 많이 감는다'],a:0,
   why:'자석을 가만히 두면 자기장이 변하지 않아 유도 전류가 아예 흐르지 않습니다.'}],
 rel:['전자기 유도','발전기','에너지 전환']},

{unit:'II-2', name:'발전기', alias:['generator','터빈'],
 one:'자석과 코일로 이루어져, 터빈이 돌면 전자기 유도로 전기 에너지를 만드는 장치.',
 body:['우리가 쓰는 전기 에너지는 대부분 발전소의 <b>발전기</b>에서 만들어집니다.',
  '발전기는 <b>자석과 코일</b>로 구성되어 있습니다. 바깥쪽에 코일이 든 철심이 <b>고정</b>되어 있고(고정자), 안쪽에 축을 따라 <b>자석이 회전</b>하는 구조예요(회전자).',
  '<b>터빈</b>이 돌아가면 발전기의 자석이 코일 속에서 회전합니다. 그러면 코일을 통과하는 자기장이 변하므로 <b>전자기 유도</b>에 의해 유도 전류가 발생해요.',
  '즉 발전기에서는 <b>터빈의 운동 에너지 → 전기 에너지</b>로 전환됩니다.',
  '발전 방식은 <b>터빈을 돌리는 에너지원</b>에 따라 화력 발전, 핵발전, 수력 발전 등으로 구분됩니다.'],
 analogy:'발전기는 <b>거꾸로 된 선풍기</b>입니다. 선풍기는 전기를 넣어 날개를 돌리지만, 발전기는 날개를 돌려서 전기를 얻어요.',
 sim:'generator',
 examples:['자가 발전형 손전등 : 손잡이를 돌리면 불이 켜짐','자전거 바퀴에 달린 발전기 → 전조등','화력·핵·수력 발전소의 발전기'],
 caution:'발전기가 에너지를 "만들어 내는" 것이 아닙니다. <b>운동 에너지를 전기 에너지로 바꾸는 것</b>이에요. 에너지 보존 법칙에 어긋나지 않습니다.',
 quiz:[{q:'발전기에서 일어나는 에너지 전환으로 옳은 것은?',
   c:['운동 에너지 → 전기 에너지','전기 에너지 → 운동 에너지','열에너지 → 화학 에너지','빛에너지 → 위치 에너지'],a:0,
   why:'터빈이 돌아 자석이 회전하면 전자기 유도로 전류가 만들어지므로, 운동 에너지가 전기 에너지로 전환됩니다.'}],
 rel:['전자기 유도','유도 전류','화력 발전','핵발전','에너지 전환']},

{unit:'II-2', name:'화력 발전', alias:['화력 발전소','thermal power'],
 one:'화석 연료를 태워 얻은 열로 증기를 만들고, 그 증기로 터빈을 돌려 전기를 만드는 발전.',
 body:['<b>화력 발전</b>에서는 석탄이나 석유 같은 <b>화석 연료가 연소</b>하면서 화학 에너지가 <b>열에너지</b>로 전환됩니다.',
  '이 열로 물을 끓여 <b>고온·고압의 증기</b>를 만들고, 증기의 <b>운동 에너지</b>로 터빈을 돌립니다. 그러면 발전기에서 전자기 유도로 <b>전기 에너지</b>가 만들어져요.',
  '<b>장점</b> : 다른 발전소에 비해 건설 비용이 적게 들고 짧은 시간에 건설할 수 있습니다. 석탄·석유·천연가스 등 다양한 연료를 쓸 수 있어 에너지 공급의 안정성이 높고, 전력 수요가 갑자기 늘어도 빠르게 대처할 수 있어요.',
  '<b>단점</b> : 화석 연료의 연소 과정에서 <b>이산화 탄소가 많이 발생</b>하여 지구 온난화가 심해질 수 있습니다.'],
 analogy:'화력 발전은 <b>주전자로 물을 끓여 그 김으로 바람개비를 돌리는 것</b>과 같습니다. 연료를 태워 물을 끓이는 단계가 추가된 것뿐이에요.',
 formula:['화학 에너지 → 열에너지 → 운동 에너지 → 전기 에너지'],
 sim:'powerplant',
 examples:['서울 화력 발전소','석탄·석유·천연가스를 쓰는 발전소'],
 caution:'화력 발전과 핵발전은 <b>터빈을 돌리는 방식은 같습니다</b>(증기로 돌림). 다른 것은 <b>열을 얻는 방법</b>입니다 — 연소냐, 핵분열이냐.',
 quiz:[{q:'화력 발전의 단점으로 가장 알맞은 것은?',
   c:['연소 과정에서 이산화 탄소가 많이 발생한다','건설 비용이 매우 많이 든다','방사성 폐기물이 많이 나온다','에너지 공급이 불안정하다'],a:0,
   why:'화력 발전은 건설이 빠르고 공급이 안정적이지만, 연소 과정에서 이산화 탄소가 많이 나와 지구 온난화를 심화시킵니다.'}],
 rel:['핵발전','발전기','전자기 유도','지구 온난화','신재생 에너지']},

{unit:'II-2', name:'핵발전', alias:['원자력 발전','핵분열','nuclear power'],
 one:'우라늄 같은 핵연료의 핵분열로 얻은 열로 증기를 만들어 터빈을 돌리는 발전.',
 body:['<b>핵발전</b>에서는 우라늄 같은 <b>핵연료가 핵분열</b>을 하면서 핵에너지가 <b>열에너지</b>로 전환됩니다.',
  '이 열로 물을 끓여 증기를 만들고, 증기의 운동 에너지로 터빈을 돌려 전기를 만듭니다. 여기서부터는 화력 발전과 같아요.',
  '<b>장점</b> : 적은 양의 연료로 <b>대량의 전력</b>을 생산할 수 있고, 연소 과정이 없어 <b>이산화 탄소 배출이 거의 없습니다</b>.',
  '<b>단점</b> : <b>방사성 폐기물</b> 처리가 어렵고, <b>방사능이 누출</b>될 경우 큰 피해가 생길 수 있습니다.',
  '또한 화석 연료나 우라늄의 매장량은 한정되어 있어 <b>언젠가 고갈</b>될 수 있으므로, 지속가능한 에너지 개발에 노력해야 합니다.'],
 analogy:'핵발전과 화력 발전은 <b>물 끓이는 방법만 다른 같은 요리</b>입니다. 하나는 장작을 태우고, 하나는 원자핵을 쪼개서 끓여요.',
 formula:['핵에너지 → 열에너지 → 운동 에너지 → 전기 에너지'],
 sim:'nuclear',
 examples:['고리 원자력 발전소','우리나라 전력 생산에서 큰 비중을 차지'],
 caution:'핵발전은 <b>핵분열</b>(무거운 원자핵이 쪼개짐)을 이용합니다. 태양의 <b>핵융합</b>(가벼운 원자핵이 합쳐짐)과 반대예요.',
 quiz:[{q:'핵발전의 특징으로 옳은 것은?',
   c:['연소 과정이 없어 이산화 탄소 배출이 거의 없다','이산화 탄소를 가장 많이 배출한다','방사성 폐기물이 나오지 않는다','태양처럼 핵융합을 이용한다'],a:0,
   why:'핵발전은 연소가 아닌 핵분열을 이용하므로 이산화 탄소 배출이 거의 없지만, 방사성 폐기물 처리 문제가 있습니다.'}],
 rel:['화력 발전','발전기','수소 핵융합 반응','신재생 에너지']},

{unit:'II-2', name:'에너지 전환', alias:['energy conversion'],
 one:'에너지가 한 형태에서 다른 형태로 바뀌는 것.',
 body:['에너지에는 <b>운동 에너지, 위치 에너지, 열에너지, 전기 에너지, 화학 에너지, 빛에너지, 소리 에너지</b> 등 다양한 종류가 있습니다.',
  '일상생활에서는 이 에너지를 <b>다양한 형태로 전환</b>하여 사용합니다.',
  '예 : 전지(화학 → 전기), 전등(전기 → 빛), 전동기(전기 → 운동), 전열기(전기 → 열), 발전기(운동 → 전기), 태양 전지(빛 → 전기), 광합성(빛 → 화학), 연소(화학 → 열), 반딧불이(화학 → 빛), 마찰(운동 → 열).',
  '중요한 것은 에너지가 전환될 때 <b>총량은 변하지 않는다</b>는 점입니다(에너지 보존 법칙).'],
 analogy:'에너지 전환은 <b>돈을 환전하는 것</b>과 같습니다. 원화를 달러로 바꿔도 가치의 총합은 그대로예요.',
 sim:'convmap',
 examples:['스마트 기기 충전 : 전기 → 소리·빛·운동·열','자동차 : 화학 → 열 → 운동','수력 발전 : 위치 → 운동 → 전기'],
 caution:'에너지 전환에서 <b>일부는 반드시 열에너지로 빠져나갑니다</b>. 그 열은 다시 쓰기 어려워서, 총량은 보존되어도 "쓸 수 있는 에너지"는 줄어듭니다.',
 quiz:[{q:'전열기에서 일어나는 에너지 전환으로 옳은 것은?',
   c:['전기 에너지 → 열에너지','열에너지 → 전기 에너지','화학 에너지 → 빛에너지','운동 에너지 → 위치 에너지'],a:0,
   why:'전열기는 전기 에너지를 열에너지로 바꾸는 장치입니다.'}],
 rel:['에너지 보존 법칙','에너지 효율','태양 에너지','발전기']},

{unit:'II-2', name:'에너지 보존 법칙', alias:['에너지 보존','conservation of energy'],
 one:'에너지는 새로 생기거나 없어지지 않고, 전환 전과 후의 총량이 항상 같다.',
 body:['에너지는 여러 가지 형태로 전환될 수 있지만 <b>새롭게 생겨나거나 소멸되지 않습니다</b>. 그리고 에너지가 전환되는 과정에서 <b>전환 전과 후의 총량은 항상 같습니다</b>. 이것이 <b>에너지 보존 법칙</b>입니다.',
  '예를 들어 스마트 기기를 충전해 사용하면 전기 에너지가 스피커의 소리 에너지, 화면의 빛에너지, 진동의 운동 에너지, 기기가 뜨거워지는 열에너지 등으로 전환됩니다.',
  '이때 <b>전환된 모든 에너지를 합하면</b> 충전에 사용된 전기 에너지와 <b>같습니다</b>.',
  '그렇다면 왜 "에너지를 절약해야" 할까요? 총량은 보존되지만, 전환 과정에서 <b>다시 쓰기 어려운 열에너지</b>로 일부가 빠져나가기 때문입니다.'],
 analogy:'에너지 보존은 <b>물의 총량은 그대로인데 컵에 나눠 담는 것</b>과 같습니다. 담는 그릇(에너지 형태)이 달라질 뿐 물의 양은 변하지 않아요.',
 formula:['전환 전 에너지의 총량 = 전환 후 에너지의 총량'],
 sim:'econserve',
 examples:['스마트 기기 : 전기 100 = 소리 34 + 빛 30 + 운동 14 + 열 22','롤러코스터 : 위치 에너지 ↔ 운동 에너지'],
 caution:'"에너지는 보존되는데 왜 절약해야 하나요?"라는 질문의 답이 시험에 자주 나옵니다. 답은 <b>전환 과정에서 다시 쓸 수 없는 열에너지로 빠져나가기 때문</b>입니다.',
 quiz:[{q:'에너지가 보존되는데도 에너지를 절약해야 하는 까닭은?',
   c:['전환 과정에서 다시 쓰기 어려운 열에너지로 일부가 빠져나가기 때문','에너지가 점점 사라지기 때문','에너지의 총량이 줄어들기 때문','에너지가 새로 생겨나기 때문'],a:0,
   why:'총량은 보존되지만 유용하게 쓸 수 있는 에너지의 양은 전환할수록 줄어듭니다.'}],
 rel:['에너지 전환','에너지 효율','신재생 에너지']},

{unit:'II-2', name:'에너지 효율', alias:['efficiency','에너지 소비 효율 등급','열효율'],
 one:'공급된 에너지 중에서 유용하게 사용된 에너지의 비율(%). 항상 100 %보다 작다.',
 body:['에너지를 원하는 형태로 전환하는 과정에서는 <b>항상 열에너지가 발생</b>하는데, 이 열에너지는 다시 사용하기 어렵습니다.',
  '즉 에너지 보존 법칙에 따라 총 에너지는 보존되지만, <b>일부 에너지는 사용되지 못하고 버려집니다</b>.',
  '이때 <b>공급된 에너지 중에서 유용하게 사용된 에너지의 비율(%)</b>을 <b>에너지 효율</b>이라고 합니다.',
  '버려지는 열에너지가 반드시 있으므로 <b>에너지 효율은 항상 100 %보다 작습니다</b>.',
  '예 : 화석 연료를 쓰는 자동차는 효율이 약 15~25 %로 낮지만, 전기 자동차는 약 87~91 %로 높습니다. 백열등보다 LED등의 효율이 훨씬 높고요.',
  '전기 제품에 붙은 <b>에너지 소비 효율 등급</b>(1~5등급)은 효율이 높은 제품 개발을 유도하기 위한 표시입니다.'],
 analogy:'에너지 효율은 <b>용돈 중에서 실제로 원하는 데 쓴 비율</b>입니다. 오는 길에 흘린 돈(열에너지)이 있으면 효율이 떨어져요.',
 formula:['에너지 효율(%) = (유용하게 사용된 에너지 ÷ 공급된 에너지) × 100<span class="sm">언제나 100 %보다 작습니다</span>'],
 sim:'efficiency',
 examples:['화석 연료 자동차 약 15~25 % ↔ 전기 자동차 약 87~91 %','백열등 → LED등으로 교체','에너지 소비 효율 등급 표시(1등급에 가까울수록 절약)'],
 caution:'에너지 효율이 100 %인 기계는 <b>만들 수 없습니다</b>. 전환 과정에서 열이 반드시 발생하기 때문이에요.',
 quiz:[{q:'에너지 효율에 대한 설명으로 옳은 것은?',
   c:['공급된 에너지 중 유용하게 사용된 에너지의 비율이며 항상 100 %보다 작다','에너지가 보존되므로 항상 100 %이다','효율이 100 %를 넘는 기계도 있다','에너지 효율은 열에너지의 양이다'],a:0,
   why:'전환 과정에서 버려지는 열에너지가 있으므로 에너지 효율은 언제나 100 %보다 작습니다.'}],
 rel:['에너지 보존 법칙','에너지 전환','신재생 에너지']},

{unit:'II-2', name:'신재생 에너지', alias:['신에너지','재생 에너지','태양광','풍력','조력','지열','연료 전지'],
 one:'화석 연료를 변환해 쓰거나, 햇빛·바다·바람 등 재생 가능한 에너지를 변환해 쓰는 에너지.',
 body:['화력 발전과 핵발전은 연료의 매장량이 <b>한정</b>되어 있고, 지구 온난화와 안전사고의 위험이 있습니다. 그래서 여러 나라가 <b>신재생 에너지</b> 개발에 힘쓰고 있어요.',
  '<b>신재생 에너지</b>는 기존의 화석 연료를 변환하여 이용하거나, 햇빛·바다·바람 등 <b>재생 가능한 에너지</b>를 변환하여 이용하는 에너지입니다.',
  '<b>신에너지</b> : 수소, 연료 전지, 석탄의 액화 및 가스화 등',
  '<b>재생 에너지</b> : 태양광, 태양열, 풍력, 수력, 해양(조력·파력), 지열, 바이오, 폐기물 등',
  '장점 : 자원이 <b>고갈될 염려가 적고</b>, 지구 환경 문제 해결에 기여할 수 있습니다. 따라서 <b>지속가능한 발전</b>을 위해 신재생 에너지를 활용해야 합니다.'],
 analogy:'화석 연료가 <b>한 번 쓰면 없어지는 건전지</b>라면, 재생 에너지는 <b>계속 채워지는 충전지</b>입니다.',
 sim:'renew',
 examples:['태양광 발전 : 태양 전지로 빛에너지 → 전기 에너지','풍력 발전 : 바람의 운동 에너지로 날개를 돌림','조력 발전 : 밀물 때 들어오는 바닷물로 터빈을 돌림','지열 발전 : 지하의 뜨거운 물과 수증기의 열 이용'],
 caution:'<b>신에너지</b>(수소·연료 전지 등)와 <b>재생 에너지</b>(태양광·풍력 등)를 구분하는 문제가 자주 나옵니다. 수소와 연료 전지는 <b>신에너지</b>예요.',
 quiz:[{q:'다음 중 "신에너지"에 해당하는 것은?',
   c:['수소, 연료 전지','태양광, 풍력','수력, 지열','조력, 파력'],a:0,
   why:'수소·연료 전지·석탄의 액화 및 가스화 등이 신에너지이고, 태양광·풍력·수력·해양·지열·바이오·폐기물 등은 재생 에너지입니다.'}],
 rel:['화력 발전','핵발전','에너지 효율','기후 변화','지구 온난화']},

/* ================= Ⅲ-1 ================= */
{unit:'III-1', name:'감염병', alias:['병원체','infectious disease','감기','독감'],
 one:'바이러스·세균·곰팡이 같은 병원체에 감염되어 발생하는 질병.',
 body:['<b>감염병</b>은 바이러스, 세균, 곰팡이 등과 같은 <b>병원체</b>에 감염되어 발생하는 질병입니다. 감기, 독감, 결핵, 폐렴, 무좀 등이 그 예예요.',
  '병원체 감염은 <b>호흡을 통한 흡입, 오염된 물과 음식물의 섭취, 피부 접촉, 수혈</b> 등 다양한 경로로 일어납니다.',
  '오늘날 전 세계 곳곳에서 새로운 감염병이 급격히 확산되는 일이 목격되고 있습니다. 그래서 감염병을 <b>진단·추적·관리</b>하는 과학 기술이 매우 중요해졌어요.',
  '과학자들은 새로운 감염병의 유행에 대비해 <b>감시 체계 구축, 백신과 치료제 확보, 방역 시스템 개선</b> 등 많은 노력을 기울이고 있습니다.'],
 analogy:'병원체는 우리 몸에 몰래 들어온 <b>불청객</b>입니다. 진단은 불청객이 있는지 확인하는 일이고, 방역은 아예 들어오지 못하게 막는 일이에요.',
 sim:'pathogen',
 examples:['바이러스 : 감기, 독감, 코로나바이러스감염증','세균 : 결핵, 폐렴','곰팡이 : 무좀'],
 caution:'<b>감염병</b>과 <b>병원체</b>는 다릅니다. 병원체는 <b>원인이 되는 생물</b>(바이러스·세균·곰팡이)이고, 감염병은 그 결과 나타나는 <b>질병</b>입니다.',

{unit:'III-1', name:'신속항원검사', alias:['항원검사','단백질 진단','검체','항체'],
 one:'검체에 바이러스를 구성하는 단백질이 있는지 확인하는 검사법.',
 body:['감염병 진단은 병원체에 감염되었는지를 판별하는 것입니다. 보통 증상이 나타난 사람에게서 <b>검체</b>(혈액·소변 등 사람이나 동물에게서 채취한 것)를 채취해, 실험실에서 병원체의 존재를 확인합니다.',
  '<b>신속항원검사</b>는 채취한 검체에 <b>바이러스를 구성하는 단백질</b>이 존재하는지를 확인하는 검사법입니다.',
  '<b>장점</b> : 일상생활에서 간편하고 빠르게 할 수 있습니다.',
  '<b>단점</b> : 검체에 들어 있는 병원체의 양이 <b>적을 경우 검출되지 않을 수도 있습니다</b>.',
  '그래서 감염 여부의 <b>최종 진단</b>은 일반적으로 유전자증폭검사를 통해 이루어집니다.'],
 analogy:'신속항원검사는 <b>겉모습만 보고 알아보는 것</b>입니다. 빠르지만, 상대가 멀리 있거나 작으면 놓칠 수 있어요.',
 sim:'antigen',
 examples:['코로나바이러스감염증 자가검사 키트','병원의 독감 신속 검사'],
